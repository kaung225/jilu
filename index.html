<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4F46E5">
<meta name="description" content="旭哥记录 - 现代专业的个人工作台">
<title>旭哥记录 · 个人工作台</title>
<style>
/* ============================================================
   旭哥记录 v9.0 - 现代专业风设计系统
   主色：深靛蓝 #4F46E5
   ============================================================ */

/* --- 设计令牌 --- */
:root{
  /* 品牌色 */
  --brand:#4F46E5;
  --brand-hover:#4338CA;
  --brand-light:#EEF2FF;
  --brand-tint:rgba(79,70,229,0.08);

  /* 背景 */
  --bg-primary:#F8FAFC;
  --bg-secondary:#FFFFFF;
  --bg-tertiary:#F1F5F9;
  --bg-hover:#F8FAFC;

  /* 文字 */
  --text-primary:#0F172A;
  --text-secondary:#475569;
  --text-tertiary:#94A3B8;
  --text-inverse:#FFFFFF;

  /* 边框 */
  --border:#E2E8F0;
  --separator:#F1F5F9;

  /* 语义色 */
  --success:#10B981;
  --success-tint:rgba(16,185,129,0.1);
  --warning:#F59E0B;
  --warning-tint:rgba(245,158,11,0.1);
  --danger:#EF4444;
  --danger-tint:rgba(239,68,68,0.1);
  --info:#3B82F6;
  --info-tint:rgba(59,130,246,0.1);

  /* 间距 8px基准 */
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-8:32px;

  /* 圆角 */
  --radius-xs:6px;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:20px;
  --radius-pill:999px;

  /* 阴影 */
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07),0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.08),0 4px 6px -4px rgba(0,0,0,0.04);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,0.1),0 8px 10px -6px rgba(0,0,0,0.05);

  /* 动画 */
  --transition-fast:150ms ease;
  --transition-normal:250ms ease;
  --transition-slow:350ms ease;

  /* 布局 */
  --sidebar-width:240px;
  --topbar-height:56px;
  --bottomnav-height:64px;
  --content-max:720px;
}

/* --- 全局重置 --- */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text-primary)}
a{color:var(--brand);text-decoration:none}
svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* --- 隐藏兼容区域 --- */
#v5Compat{display:none}

/* ============================================================
   布局
   ============================================================ */

/* --- 主内容区 --- */
.main{
  max-width:var(--content-max);
  margin:0 auto;
  padding:var(--space-4);
  padding-bottom:calc(var(--bottomnav-height) + var(--space-6));
  min-height:100vh;
}

/* --- 页面 --- */
.page{display:none}
.page.active{display:block;animation:fadeIn 0.25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   顶部栏（移动端）
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(248,250,252,0.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:0.5px solid var(--border);
  padding:var(--space-3) var(--space-4);
  display:flex;align-items:center;justify-content:space-between;
  max-width:var(--content-max);
  margin:0 auto;
}
.topbar-left{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.topbar-title{font-size:18px;font-weight:700;color:var(--text-primary);line-height:1.2}
.topbar-sub{font-size:11px;color:var(--text-tertiary);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:var(--space-2)}

/* 图标按钮 */
.icon-btn{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  transition:all var(--transition-fast);
  flex-shrink:0;
}
.icon-btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.icon-btn:active{transform:scale(0.95)}
.icon-btn svg{width:18px;height:18px}

.back-btn{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  transition:all var(--transition-fast);
  flex-shrink:0;
}
.back-btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.back-btn svg{width:18px;height:18px}

/* ============================================================
   底部导航（移动端）
   ============================================================ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  height:var(--bottomnav-height);
  padding:0 var(--space-2);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
  padding:var(--space-1) var(--space-3);
  border-radius:var(--radius-sm);
  color:var(--text-tertiary);
  transition:all var(--transition-fast);
  flex:1;
  max-width:80px;
}
.nav-tab svg{width:22px;height:22px}
.nav-tab span{font-size:10px;font-weight:500}
.nav-tab.active{color:var(--brand)}
.nav-tab:active{transform:scale(0.95)}

/* FAB */
.nav-fab{
  width:48px;height:48px;
  border-radius:var(--radius-pill);
  background:var(--brand);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(79,70,229,0.35);
  transition:all var(--transition-fast);
  margin-top:-20px;
  flex-shrink:0;
}
.nav-fab:hover{background:var(--brand-hover);transform:scale(1.05)}
.nav-fab:active{transform:scale(0.95)}
.nav-fab svg{width:22px;height:22px}

/* ============================================================
   桌面侧边栏
   ============================================================ */
.desktop-sidebar{display:none}

@media(min-width:1024px){
  .desktop-sidebar{
    position:fixed;left:0;top:0;bottom:0;
    width:var(--sidebar-width);
    background:var(--bg-secondary);
    border-right:0.5px solid var(--border);
    padding:var(--space-5) var(--space-4);
    display:flex;flex-direction:column;
    z-index:90;
  }
  .sidebar-logo{
    display:flex;align-items:center;gap:var(--space-3);
    padding:var(--space-2) var(--space-3);
    margin-bottom:var(--space-6);
  }
  .sidebar-logo .sl-icon{
    width:36px;height:36px;
    border-radius:var(--radius-sm);
    background:linear-gradient(135deg,var(--brand),#6366F1);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .sidebar-logo .sl-icon svg{width:18px;height:18px}
  .sidebar-logo .sl-name{font-size:16px;font-weight:700}
  .sidebar-logo .sl-sub{font-size:11px;color:var(--text-tertiary)}

  .sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px}
  .sidebar-section{
    font-size:10px;font-weight:600;
    color:var(--text-tertiary);
    text-transform:uppercase;
    letter-spacing:0.8px;
    padding:var(--space-4) var(--space-3) var(--space-2);
  }
  .sidebar-item{
    display:flex;align-items:center;gap:var(--space-3);
    padding:var(--space-3);
    border-radius:var(--radius-sm);
    font-size:14px;font-weight:500;
    color:var(--text-secondary);
    transition:all var(--transition-fast);
    text-align:left;width:100%;
  }
  .sidebar-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}
  .sidebar-item.active{background:var(--brand-tint);color:var(--brand);font-weight:600}
  .sidebar-item svg{width:18px;height:18px;flex-shrink:0}

  .sidebar-footer{
    padding-top:var(--space-4);
    border-top:0.5px solid var(--separator);
  }
  .sidebar-user{
    display:flex;align-items:center;gap:var(--space-3);
    padding:var(--space-3);
    border-radius:var(--radius-sm);
    transition:background var(--transition-fast);
  }
  .sidebar-user:hover{background:var(--bg-tertiary)}
  .sidebar-user .su-avatar{
    width:36px;height:36px;
    border-radius:var(--radius-pill);
    background:linear-gradient(135deg,var(--brand),#6366F1);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;font-weight:600;
    flex-shrink:0;
  }
  .sidebar-user .su-name{font-size:13px;font-weight:600}
  .sidebar-user .su-email{font-size:11px;color:var(--text-tertiary)}

  /* 桌面端隐藏移动端元素 */
  .topbar{display:none}
  .bottom-nav{display:none}
  .main{
    margin-left:var(--sidebar-width);
    max-width:none;
    padding:var(--space-6) var(--space-8);
    padding-bottom:var(--space-8);
  }
}

/* ============================================================
   通用组件
   ============================================================ */

/* --- 卡片 --- */
.card{
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  border:0.5px solid var(--border);
  box-shadow:var(--shadow-xs);
  overflow:hidden;
}

/* --- 区块标题 --- */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--space-3);
  margin-top:var(--space-6);
}
.section-header:first-child{margin-top:0}
.section-title{font-size:15px;font-weight:600;color:var(--text-primary)}
.section-action{
  font-size:12px;color:var(--brand);font-weight:500;
  display:flex;align-items:center;gap:2px;
}
.section-action:hover{text-decoration:underline}
.section-action svg{width:12px;height:12px}

/* --- 统计卡片网格 --- */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--space-3);
  margin-bottom:var(--space-5);
}
.stat-card{
  background:var(--bg-secondary);
  border-radius:var(--radius-md);
  border:0.5px solid var(--border);
  padding:var(--space-4);
  box-shadow:var(--shadow-xs);
  transition:all var(--transition-fast);
}
.stat-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.stat-card .stat-label{
  font-size:11px;color:var(--text-tertiary);
  font-weight:500;text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:var(--space-2);
}
.stat-card .stat-value{
  font-size:22px;font-weight:700;
  color:var(--text-primary);
  line-height:1.2;
}
.stat-card .stat-sub{
  font-size:11px;color:var(--text-tertiary);
  margin-top:2px;
}

/* ============================================================
   首页
   ============================================================ */

/* --- 问候区 --- */
.greeting{
  padding:var(--space-2) 0 var(--space-5);
}
.greeting .greet-text{
  font-size:24px;font-weight:700;
  color:var(--text-primary);
  line-height:1.2;
  margin-bottom:var(--space-1);
}
.greeting .greet-sub{
  font-size:13px;color:var(--text-secondary);
  display:flex;align-items:center;gap:var(--space-2);
}
.greeting .sync-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--success);
  display:inline-block;
}

/* --- 快速记录网格 --- */
.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:var(--space-3);
  margin-bottom:var(--space-5);
}
.quick-item{
  background:var(--bg-secondary);
  border-radius:var(--radius-md);
  border:0.5px solid var(--border);
  padding:var(--space-4) var(--space-2);
  text-align:center;
  transition:all var(--transition-fast);
  box-shadow:var(--shadow-xs);
  display:flex;flex-direction:column;align-items:center;gap:var(--space-2);
}
.quick-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--brand)}
.quick-item:active{transform:scale(0.97)}
.quick-item .qi-icon{
  width:40px;height:40px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  color:#fff;
}
.quick-item .qi-icon svg{width:20px;height:20px}
.quick-item .qi-name{font-size:12px;font-weight:500;color:var(--text-primary)}

.qi-teaching .qi-icon{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.qi-task .qi-icon{background:linear-gradient(135deg,#F59E0B,#D97706)}
.qi-finance .qi-icon{background:linear-gradient(135deg,#10B981,#059669)}
.qi-idea .qi-icon{background:linear-gradient(135deg,#8B5CF6,#7C3AED)}

/* --- 最近记录列表 --- */
.recent-card{
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  border:0.5px solid var(--border);
  box-shadow:var(--shadow-xs);
  overflow:hidden;
  margin-bottom:var(--space-5);
}
.recent-item{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);
  border-bottom:0.5px solid var(--separator);
  transition:background var(--transition-fast);
  cursor:pointer;
}
.recent-item:last-child{border-bottom:none}
.recent-item:hover{background:var(--bg-hover)}
.recent-item .ri-icon{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.recent-item .ri-icon svg{width:18px;height:18px;color:#fff}
.recent-item .ri-content{flex:1;min-width:0}
.recent-item .ri-title{
  font-size:14px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.recent-item .ri-meta{font-size:11px;color:var(--text-tertiary);margin-top:1px}
.recent-item .ri-amount{font-size:14px;font-weight:600;flex-shrink:0}
.recent-item .ri-amount.expense{color:var(--danger)}
.recent-item .ri-amount.income{color:var(--success)}

/* --- 模块入口列表 --- */
.modules-card{
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  border:0.5px solid var(--border);
  box-shadow:var(--shadow-xs);
  overflow:hidden;
}
.module-entry{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-4);
  border-bottom:0.5px solid var(--separator);
  transition:background var(--transition-fast);
  cursor:pointer;
  width:100%;text-align:left;
}
.module-entry:last-child{border-bottom:none}
.module-entry:hover{background:var(--bg-hover)}
.module-entry .me-icon{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.module-entry .me-icon svg{width:18px;height:18px;color:#fff}
.module-entry .me-content{flex:1;min-width:0}
.module-entry .me-name{font-size:14px;font-weight:600;margin-bottom:1px}
.module-entry .me-desc{font-size:11px;color:var(--text-tertiary)}
.module-entry .me-stat{font-size:12px;color:var(--text-secondary);font-weight:500;flex-shrink:0}
.module-entry .me-arrow{color:var(--text-tertiary);flex-shrink:0}
.module-entry .me-arrow svg{width:14px;height:14px}

.me-teaching .me-icon{background:var(--info-tint);color:var(--info)}
.me-teaching .me-icon svg{color:var(--info)}
.me-life .me-icon{background:var(--warning-tint);color:var(--warning)}
.me-life .me-icon svg{color:var(--warning)}
.me-study .me-icon{background:var(--brand-tint);color:var(--brand)}
.me-study .me-icon svg{color:var(--brand)}
.me-project .me-icon{background:var(--success-tint);color:var(--success)}
.me-project .me-icon svg{color:var(--success)}
.me-finance .me-icon{background:var(--danger-tint);color:var(--danger)}
.me-finance .me-icon svg{color:var(--danger)}
.me-tools .me-icon{background:var(--bg-tertiary);color:var(--text-secondary)}
.me-tools .me-icon svg{color:var(--text-secondary)}

/* ============================================================
   子页面
   ============================================================ */

/* --- 子页面头部 --- */
.subpage-header{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-2) 0 var(--space-4);
}
.subpage-title{font-size:20px;font-weight:700;color:var(--text-primary)}
.subpage-breadcrumb{
  font-size:11px;color:var(--text-tertiary);
  margin-top:2px;
  display:flex;align-items:center;gap:4px;
}
.subpage-breadcrumb svg{width:10px;height:10px}

/* --- 子标签 --- */
.sub-tabs{
  display:flex;gap:var(--space-1);
  overflow-x:auto;
  padding-bottom:var(--space-1);
  margin-bottom:var(--space-4);
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{
  padding:var(--space-2) var(--space-4);
  border-radius:var(--radius-pill);
  font-size:13px;font-weight:500;
  color:var(--text-secondary);
  background:var(--bg-secondary);
  border:0.5px solid var(--border);
  white-space:nowrap;
  transition:all var(--transition-fast);
  flex-shrink:0;
}
.sub-tab:hover{color:var(--text-primary)}
.sub-tab.active{
  background:var(--brand);
  color:#fff;
  border-color:var(--brand);
  font-weight:600;
}

/* --- 内容区 --- */
.page-content{min-height:300px}

/* ============================================================
   空状态
   ============================================================ */
.empty-state{
  padding:var(--space-8) var(--space-4);
  text-align:center;
}
.empty-state .es-icon{
  width:48px;height:48px;
  border-radius:var(--radius-md);
  background:var(--bg-tertiary);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto var(--space-4);
  color:var(--text-tertiary);
}
.empty-state .es-icon svg{width:24px;height:24px}
.empty-state .es-title{
  font-size:15px;font-weight:600;
  color:var(--text-primary);
  margin-bottom:var(--space-2);
}
.empty-state .es-desc{
  font-size:13px;color:var(--text-tertiary);
  margin-bottom:var(--space-5);
  max-width:280px;
  margin-left:auto;margin-right:auto;
}
.empty-state .es-cta{
  display:inline-flex;align-items:center;gap:var(--space-2);
  padding:var(--space-3) var(--space-5);
  background:var(--brand);
  color:#fff;
  border-radius:var(--radius-md);
  font-size:14px;font-weight:600;
  transition:all var(--transition-fast);
  box-shadow:0 2px 8px rgba(79,70,229,0.25);
}
.empty-state .es-cta:hover{background:var(--brand-hover)}
.empty-state .es-cta:active{transform:scale(0.97)}
.empty-state .es-cta svg{width:16px;height:16px}

/* ============================================================
   工具页面
   ============================================================ */
.tools-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--space-3);
}
.tool-card{
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  border:0.5px solid var(--border);
  padding:var(--space-4);
  box-shadow:var(--shadow-xs);
  transition:all var(--transition-fast);
  cursor:pointer;
  display:flex;flex-direction:column;gap:var(--space-2);
  text-align:left;
}
.tool-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--brand)}
.tool-card:active{transform:scale(0.98)}
.tool-card .ti-icon{
  width:40px;height:40px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:var(--space-1);
}
.tool-card .ti-icon svg{width:20px;height:20px;color:#fff}
.tool-card .ti-name{font-size:14px;font-weight:600;color:var(--text-primary)}
.tool-card .ti-desc{font-size:11px;color:var(--text-tertiary);line-height:1.4}

.ti-pomo .ti-icon{background:linear-gradient(135deg,#EF4444,#DC2626)}
.ti-review .ti-icon{background:linear-gradient(135deg,#8B5CF6,#7C3AED)}
.ti-fx .ti-icon{background:linear-gradient(135deg,#06B6D4,#0891B2)}
.ti-loan .ti-icon{background:linear-gradient(135deg,#F59E0B,#D97706)}
.ti-export .ti-icon{background:linear-gradient(135deg,#10B981,#059669)}
.ti-quick .ti-icon{background:linear-gradient(135deg,#3B82F6,#2563EB)}

/* ============================================================
   模态框
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(15,23,42,0.5);
  backdrop-filter:blur(4px);
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.modal-overlay.show{display:flex;animation:fadeIn 0.2s ease}
.modal{
  background:var(--bg-secondary);
  width:100%;
  max-width:520px;
  max-height:90vh;
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  display:flex;flex-direction:column;
  animation:slideUp 0.3s ease;
  overflow:hidden;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-4) var(--space-5);
  border-bottom:0.5px solid var(--separator);
  flex-shrink:0;
}
.modal-title{font-size:17px;font-weight:700;color:var(--text-primary)}
.modal-close{
  width:32px;height:32px;
  border-radius:var(--radius-pill);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);
  transition:all var(--transition-fast);
}
.modal-close:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.modal-close svg{width:16px;height:16px}
.modal-body{
  padding:var(--space-5);
  overflow-y:auto;
  flex:1;
}
.modal-footer{
  padding:var(--space-4) var(--space-5);
  border-top:0.5px solid var(--separator);
  display:flex;gap:var(--space-3);
  flex-shrink:0;
}

@media(min-width:640px){
  .modal-overlay{align-items:center}
  .modal{border-radius:var(--radius-xl)}
}

/* 表单元素 */
.form-group{margin-bottom:var(--space-4)}
.form-label{
  display:block;
  font-size:12px;font-weight:600;
  color:var(--text-secondary);
  margin-bottom:var(--space-2);
}
.form-input,.form-select,.form-textarea{
  width:100%;
  padding:var(--space-3) var(--space-4);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  background:var(--bg-primary);
  transition:all var(--transition-fast);
  color:var(--text-primary);
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  outline:none;
  border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-tint);
}
.form-textarea{resize:vertical;min-height:80px}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  padding:var(--space-3) var(--space-5);
  border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;
  transition:all var(--transition-fast);
  cursor:pointer;
  border:none;
}
.btn-primary{
  background:var(--brand);
  color:#fff;
  box-shadow:0 2px 8px rgba(79,70,229,0.25);
}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary:active{transform:scale(0.97)}
.btn-secondary{
  background:var(--bg-tertiary);
  color:var(--text-primary);
}
.btn-secondary:hover{background:var(--border)}
.btn-danger{
  background:var(--danger-tint);
  color:var(--danger);
}
.btn-danger:hover{background:rgba(239,68,68,0.15)}
.btn-block{width:100%}
.btn svg{width:16px;height:16px}

/* ============================================================
   搜索
   ============================================================ */
.search-overlay{
  position:fixed;inset:0;z-index:150;
  background:var(--bg-primary);
  display:none;
  flex-direction:column;
  animation:fadeIn 0.2s ease;
}
.search-overlay.show{display:flex}
.search-header{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-4);
  border-bottom:0.5px solid var(--border);
  background:var(--bg-secondary);
}
.search-input-wrap{
  flex:1;
  display:flex;align-items:center;gap:var(--space-2);
  padding:var(--space-2) var(--space-3);
  background:var(--bg-tertiary);
  border-radius:var(--radius-sm);
}
.search-input-wrap svg{width:16px;height:16px;color:var(--text-tertiary);flex-shrink:0}
.search-input{
  flex:1;
  border:none;
  background:transparent;
  font-size:14px;
  outline:none;
  color:var(--text-primary);
}
.search-close{
  font-size:14px;color:var(--brand);font-weight:500;
  padding:var(--space-2);
}
.search-results{
  flex:1;
  overflow-y:auto;
  padding:var(--space-4);
}

/* ============================================================
   Toast
   ============================================================ */
.toast-container{
  position:fixed;top:var(--space-4);left:50%;
  transform:translateX(-50%);
  z-index:300;
  display:flex;flex-direction:column;gap:var(--space-2);
  pointer-events:none;
}
.toast{
  background:var(--text-primary);
  color:#fff;
  padding:var(--space-3) var(--space-5);
  border-radius:var(--radius-pill);
  font-size:13px;font-weight:500;
  box-shadow:var(--shadow-lg);
  animation:toastIn 0.3s ease;
  display:flex;align-items:center;gap:var(--space-2);
}
.toast svg{width:14px;height:14px}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   确认框
   ============================================================ */
.confirm-overlay{
  position:fixed;inset:0;z-index:250;
  background:rgba(15,23,42,0.5);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;justify-content:center;
  padding:var(--space-4);
}
.confirm-overlay.show{display:flex;animation:fadeIn 0.2s ease}
.confirm-box{
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  padding:var(--space-6);
  width:100%;
  max-width:360px;
  text-align:center;
  box-shadow:var(--shadow-xl);
  animation:scaleIn 0.2s ease;
}
@keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
.confirm-title{font-size:17px;font-weight:700;margin-bottom:var(--space-2)}
.confirm-desc{font-size:14px;color:var(--text-secondary);margin-bottom:var(--space-6)}
.confirm-actions{display:flex;gap:var(--space-3)}
.confirm-actions .btn{flex:1}

/* ============================================================
   标签/徽章
   ============================================================ */
.badge{
  display:inline-flex;align-items:center;
  padding:2px 8px;
  border-radius:var(--radius-pill);
  font-size:11px;font-weight:600;
}
.badge-success{background:var(--success-tint);color:var(--success)}
.badge-warning{background:var(--warning-tint);color:var(--warning)}
.badge-danger{background:var(--danger-tint);color:var(--danger)}
.badge-info{background:var(--info-tint);color:var(--info)}
.badge-brand{background:var(--brand-tint);color:var(--brand)}

/* ============================================================
   列表项通用
   ============================================================ */
.list-item{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-4);
  background:var(--bg-secondary);
  border-bottom:0.5px solid var(--separator);
  transition:background var(--transition-fast);
  cursor:pointer;
}
.list-item:hover{background:var(--bg-hover)}
.list-item .li-icon{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.list-item .li-icon svg{width:18px;height:18px;color:#fff}
.list-item .li-content{flex:1;min-width:0}
.list-item .li-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .li-sub{font-size:12px;color:var(--text-tertiary);margin-top:1px}
.list-item .li-extra{font-size:13px;color:var(--text-secondary);font-weight:500;flex-shrink:0}
.list-item .li-arrow{color:var(--text-tertiary);flex-shrink:0}
.list-item .li-arrow svg{width:14px;height:14px}

/* ============================================================
   进度条
   ============================================================ */
.progress-bar{
  width:100%;height:6px;
  background:var(--bg-tertiary);
  border-radius:var(--radius-pill);
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--brand),#6366F1);
  border-radius:var(--radius-pill);
  transition:width 0.5s ease;
}

/* ============================================================
   图标选择器/颜色选择器
   ============================================================ */
.icon-picker{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:var(--space-2);
}
.icon-picker .ip-item{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid transparent;
  transition:all var(--transition-fast);
  cursor:pointer;
  color:var(--text-secondary);
}
.icon-picker .ip-item:hover{background:var(--bg-tertiary)}
.icon-picker .ip-item.selected{
  border-color:var(--brand);
  background:var(--brand-tint);
  color:var(--brand);
}
.icon-picker .ip-item svg{width:18px;height:18px}

.color-picker{
  display:flex;flex-wrap:wrap;gap:var(--space-2);
}
.color-picker .cp-item{
  width:28px;height:28px;
  border-radius:var(--radius-pill);
  border:2px solid transparent;
  cursor:pointer;
  transition:all var(--transition-fast);
}
.color-picker .cp-item.selected{
  border-color:var(--text-primary);
  transform:scale(1.1);
}

/* ============================================================
   响应式
   ============================================================ */
@media(max-width:480px){
  .stats-grid{grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
  .stat-card{padding:var(--space-3)}
  .stat-card .stat-value{font-size:18px}
  .quick-grid{gap:var(--space-2)}
  .quick-item{padding:var(--space-3) var(--space-1)}
  .quick-item .qi-icon{width:36px;height:36px}
  .quick-item .qi-icon svg{width:18px;height:18px}
  .quick-item .qi-name{font-size:11px}
  .greeting .greet-text{font-size:20px}
}

@media(min-width:768px){
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .tools-grid{grid-template-columns:repeat(3,1fr)}
}

@media(min-width:1024px){
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .tools-grid{grid-template-columns:repeat(4,1fr)}
  .quick-grid{grid-template-columns:repeat(4,1fr);max-width:600px}
}

/* 减少动效 */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}

/* 焦点样式 */
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--brand);
  outline-offset:2px;
}


/* ============================================================
   v9.0 - v5动态渲染内容的全新样式覆盖
   所有子页面（教学/生活/学习/项目/财务/工具/设置）的动态内容
   ============================================================ */

/* --- 板块卡片网格 --- */
.section-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:var(--space-3);
  margin-bottom:var(--space-4);
}
.section-card{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-4);
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  border:0.5px solid var(--border);
  box-shadow:var(--shadow-xs);
  cursor:pointer;
  transition:all var(--transition-fast);
  text-align:left;
  width:100%;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.section-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
  border-color:var(--brand);
}
.section-card:active{
  transform:scale(0.97);
  background:var(--bg-hover);
}
/* 确保子元素不拦截点击事件（但保留操作按钮的点击） */
.section-card .sc-icon,
.section-card .sc-content,
.section-card .sc-stat,
.section-card .sc-arrow{
  pointer-events:none;
}
.section-card .sc-icon{
  width:44px;height:44px;
  border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  background:var(--brand-tint);
  color:var(--brand);
}
.section-card .sc-icon svg{width:22px;height:22px}
.section-card .sc-content{flex:1;min-width:0}
.section-card .sc-name{
  font-size:15px;font-weight:600;
  color:var(--text-primary);
  margin-bottom:2px;
}
.section-card .sc-desc{
  font-size:12px;color:var(--text-tertiary);
}
.section-card .sc-stat{
  font-size:12px;color:var(--text-secondary);
  font-weight:500;
  flex-shrink:0;
  background:var(--bg-tertiary);
  padding:4px 10px;
  border-radius:var(--radius-pill);
}
.section-card .sc-arrow{
  color:var(--text-tertiary);
  flex-shrink:0;
}
.section-card .sc-arrow svg{width:16px;height:16px}

/* 板块图标颜色 */
.sc-teaching .sc-icon{background:var(--info-tint);color:var(--info)}
.sc-life .sc-icon{background:var(--warning-tint);color:var(--warning)}
.sc-study .sc-icon{background:var(--brand-tint);color:var(--brand)}
.sc-project .sc-icon{background:var(--success-tint);color:var(--success)}
.sc-plans .sc-icon{background:var(--danger-tint);color:var(--danger)}
.fc-overview .sc-icon{background:var(--info-tint);color:var(--info)}
.fc-accounts .sc-icon{background:var(--brand-tint);color:var(--brand)}
.fc-records .sc-icon{background:var(--success-tint);color:var(--success)}
.fc-budget .sc-icon{background:var(--warning-tint);color:var(--warning)}
.fc-saving .sc-icon{background:var(--success-tint);color:var(--success)}
.fc-debt .sc-icon{background:var(--danger-tint);color:var(--danger)}
.fc-category .sc-icon{background:var(--bg-tertiary);color:var(--text-secondary)}

@media(min-width:640px){
  .section-grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1024px){
  .section-grid{grid-template-columns:repeat(3,1fr)}
}

/* --- 分类列表 --- */
.category-list{
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  border:0.5px solid var(--border);
  overflow:hidden;
  margin-bottom:var(--space-4);
}
.category-item{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);
  border-bottom:0.5px solid var(--separator);
  cursor:pointer;
  transition:background var(--transition-fast);
}
.category-item:last-child{border-bottom:none}
.category-item:hover{background:var(--bg-hover)}
.category-item .cat-icon{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  color:#fff;
}
.category-item .cat-icon svg{width:18px;height:18px}
.category-item .cat-name{
  flex:1;
  font-size:14px;font-weight:500;
  color:var(--text-primary);
}
.category-item .cat-actions{
  display:flex;gap:var(--space-2);
  flex-shrink:0;
}
.category-item .cat-edit,
.category-item .cat-delete{
  width:32px;height:32px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition-fast);
}
.category-item .cat-edit{color:var(--brand)}
.category-item .cat-edit:hover{background:var(--brand-tint)}
.category-item .cat-delete{color:var(--danger)}
.category-item .cat-delete:hover{background:var(--danger-tint)}
.category-item .cat-edit svg,
.category-item .cat-delete svg{width:16px;height:16px}

/* --- 统计卡可点击 --- */
.stat-card{
  cursor:pointer;
  transition:all var(--transition-fast);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.stat-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
  border-color:var(--brand);
}
.stat-card:active{
  transform:scale(0.97);
  background:var(--bg-hover);
}

/* --- 快速记录卡片 --- */
.quick-item{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* --- 模块入口卡片 --- */
.module-entry{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* --- 卡片可点击 --- */
.card{
  cursor:pointer;
  transition:all var(--transition-fast);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.card:hover{
  box-shadow:var(--shadow-sm);
  border-color:var(--brand);
}
.card:active{
  transform:scale(0.98);
}

/* --- 列表项可点击 --- */
.list-item{
  cursor:pointer;
  transition:background var(--transition-fast);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.list-item:hover{background:var(--bg-hover)}
.list-item:active{background:var(--brand-tint)}

/* --- 网格项可点击 --- */
.grid-item{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* --- 时间线项可点击 --- */
.timeline-item{
  cursor:pointer;
  transition:background var(--transition-fast);
  padding:var(--space-2);
  border-radius:var(--radius-sm);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.timeline-item:hover{background:var(--bg-hover)}
.timeline-item:active{background:var(--brand-tint)}

/* --- 灵感卡片可点击 --- */
.idea-card{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* --- 考勤行可点击 --- */
.att-row{
  cursor:pointer;
  transition:background var(--transition-fast);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.att-row:hover{background:var(--bg-hover)}
.att-row:active{background:var(--brand-tint)}

/* --- 分类项可点击 --- */
.category-item{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.category-item:active{background:var(--bg-hover)}

/* --- 表单 --- */
.form-group{
  margin-bottom:var(--space-4);
}
.form-group .label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--text-secondary);
  margin-bottom:var(--space-2);
}
.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:var(--space-3);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  font-size:14px;
  color:var(--text-primary);
  background:var(--bg-primary);
  transition:border-color var(--transition-fast);
  box-sizing:border-box;
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  outline:none;
  border-color:var(--brand);
}

/* --- 图标网格选择器 --- */
.icon-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:var(--space-2);
}
.icon-opt{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:var(--radius-md);
  border:1.5px solid var(--border);
  cursor:pointer;
  transition:all var(--transition-fast);
  color:var(--text-secondary);
  background:var(--bg-primary);
}
.icon-opt svg{width:20px;height:20px}
.icon-opt:hover{
  border-color:var(--brand);
  color:var(--brand);
}
.icon-opt.selected{
  border-color:var(--brand);
  background:var(--brand-tint);
  color:var(--brand);
}

/* --- 颜色选择器 --- */
.color-picker{
  display:flex;
  flex-wrap:wrap;
  gap:var(--space-2);
}
.color-dot{
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer;
  transition:all var(--transition-fast);
  border:2px solid transparent;
}
.color-dot:hover{
  transform:scale(1.1);
}
.color-dot.selected{
  border-color:var(--text-primary);
  transform:scale(1.1);
}

/* --- 卡片 --- */
.card{
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  border:0.5px solid var(--border);
  box-shadow:var(--shadow-xs);
  padding:var(--space-4);
  margin-bottom:var(--space-4);
  overflow:hidden;
}
.card-title{
  font-size:15px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:var(--space-3);
  display:flex;align-items:center;gap:var(--space-2);
}
.card-title svg{width:18px;height:18px;color:var(--brand)}

/* --- 网格 --- */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--space-3);
}
.grid-item{
  background:var(--bg-primary);
  border-radius:var(--radius-md);
  border:0.5px solid var(--border);
  padding:var(--space-4);
  text-align:center;
  cursor:pointer;
  transition:all var(--transition-fast);
  display:flex;flex-direction:column;align-items:center;gap:var(--space-2);
}
.grid-item:hover{
  border-color:var(--brand);
  box-shadow:var(--shadow-sm);
  transform:translateY(-1px);
}
.grid-item:active{transform:scale(0.98)}
.grid-item .ic{
  width:44px;height:44px;
  border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:var(--space-1);
}
.grid-item .ic svg{width:22px;height:22px;color:#fff}
.grid-item .lbl{
  font-size:13px;font-weight:600;
  color:var(--text-primary);
}

/* --- 标签 --- */
.tag{
  display:inline-flex;align-items:center;
  padding:3px 10px;
  border-radius:var(--radius-pill);
  font-size:11px;font-weight:600;
  line-height:1.4;
}
.tag-success{background:var(--success-tint);color:var(--success)}
.tag-warning{background:var(--warning-tint);color:var(--warning)}
.tag-danger{background:var(--danger-tint);color:var(--danger)}
.tag-info{background:var(--info-tint);color:var(--info)}

/* --- 统计卡 --- */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--space-3);
  margin-bottom:var(--space-4);
}
.stat-card{
  background:var(--bg-secondary);
  border-radius:var(--radius-md);
  border:0.5px solid var(--border);
  padding:var(--space-4);
  box-shadow:var(--shadow-xs);
  text-align:left;
}
.stat-card .label{
  font-size:11px;color:var(--text-tertiary);
  font-weight:600;text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:var(--space-2);
}
.stat-card .value,
.stat-card .number{
  font-size:22px;font-weight:700;
  color:var(--text-primary);
  line-height:1.2;
}
.stat-card .hint{
  font-size:11px;color:var(--text-tertiary);
  margin-top:2px;
}

/* --- 列表项 --- */
.list-item{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-4);
  background:var(--bg-secondary);
  border-bottom:0.5px solid var(--separator);
  cursor:pointer;
  transition:background var(--transition-fast);
}
.list-item:first-child{border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.list-item:last-child{border-bottom:none;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.list-item:hover{background:var(--bg-hover)}
.list-item .icon{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  background:var(--brand-tint);
  color:var(--brand);
}
.list-item .icon svg{width:18px;height:18px}
.list-item .title{
  font-size:14px;font-weight:600;
  color:var(--text-primary);
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.list-item .desc{
  font-size:12px;color:var(--text-tertiary);
  margin-top:2px;
}
.list-item .right{
  flex-shrink:0;
  display:flex;align-items:center;gap:var(--space-2);
}
.list-item .action{
  font-size:12px;color:var(--brand);font-weight:600;
}
.list-item .amount{
  font-size:15px;font-weight:700;
}
.list-item .amount.expense{color:var(--danger)}
.list-item .amount.income{color:var(--success)}
.list-item .date{
  font-size:11px;color:var(--text-tertiary);
}
.list-item .currency{
  font-size:11px;color:var(--text-tertiary);
  margin-right:2px;
}

/* --- 空状态 --- */
.empty{
  padding:var(--space-8) var(--space-4);
  text-align:center;
}
.empty .icon{
  width:56px;height:56px;
  border-radius:var(--radius-lg);
  background:var(--bg-tertiary);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto var(--space-4);
  color:var(--text-tertiary);
}
.empty .icon svg{width:28px;height:28px}
.empty .title{
  font-size:15px;font-weight:600;
  color:var(--text-primary);
  margin-bottom:var(--space-2);
}
.empty .desc{
  font-size:13px;color:var(--text-tertiary);
  margin-bottom:var(--space-5);
  max-width:280px;
  margin-left:auto;margin-right:auto;
}

/* --- 按钮 --- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  padding:var(--space-3) var(--space-5);
  border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;
  transition:all var(--transition-fast);
  cursor:pointer;
  border:none;
  white-space:nowrap;
}
.btn-primary{
  background:var(--brand);
  color:#fff;
  box-shadow:0 2px 8px rgba(79,70,229,0.25);
}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary:active{transform:scale(0.97)}
.btn-secondary{
  background:var(--bg-tertiary);
  color:var(--text-primary);
}
.btn-secondary:hover{background:var(--border)}
.btn-danger{
  background:var(--danger-tint);
  color:var(--danger);
}
.btn-danger:hover{background:rgba(239,68,68,0.15)}
.btn-sm{
  padding:var(--space-2) var(--space-3);
  font-size:12px;
}
.btn-block{width:100%}
.btns{
  display:flex;gap:var(--space-3);
  margin-top:var(--space-4);
}
.btns .btn{flex:1}

/* --- 表单 --- */
.form-group{margin-bottom:var(--space-4)}
.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--space-3);
  margin-bottom:var(--space-4);
}
.form-group .label,
.form-row .label{
  display:block;
  font-size:12px;font-weight:600;
  color:var(--text-secondary);
  margin-bottom:var(--space-2);
}
.form-group .hint,
.form-row .hint{
  font-size:11px;color:var(--text-tertiary);
  margin-top:var(--space-1);
}
.form-group input,
.form-group select,
.form-group textarea,
.form-row input,
.form-row select,
.form-row textarea{
  width:100%;
  padding:var(--space-3) var(--space-4);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  background:var(--bg-primary);
  transition:all var(--transition-fast);
  color:var(--text-primary);
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus,
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus{
  outline:none;
  border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-tint);
}

/* --- 数字键盘 --- */
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--space-2);
  margin-top:var(--space-4);
}
.keypad .number,
.keypad .op{
  padding:var(--space-4);
  background:var(--bg-primary);
  border:0.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:18px;font-weight:600;
  color:var(--text-primary);
  cursor:pointer;
  transition:all var(--transition-fast);
  text-align:center;
}
.keypad .number:hover,
.keypad .op:hover{background:var(--bg-tertiary);border-color:var(--brand)}
.keypad .number:active,
.keypad .op:active{transform:scale(0.95)}
.keypad .op{
  background:var(--brand-tint);
  color:var(--brand);
  border-color:transparent;
}
.amount-display{
  background:var(--bg-primary);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:var(--space-4);
  text-align:center;
  font-size:32px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:var(--space-2);
}
.amount-display .currency{
  font-size:18px;
  color:var(--text-tertiary);
  margin-right:4px;
}

/* --- 分段控制器 --- */
.segment{
  display:flex;
  background:var(--bg-tertiary);
  border-radius:var(--radius-sm);
  padding:3px;
  gap:2px;
  margin-bottom:var(--space-4);
}
.segment button{
  flex:1;
  padding:var(--space-2) var(--space-3);
  border-radius:var(--radius-xs);
  font-size:13px;font-weight:500;
  color:var(--text-secondary);
  transition:all var(--transition-fast);
  text-align:center;
}
.segment button.active{
  background:var(--bg-secondary);
  color:var(--text-primary);
  font-weight:600;
  box-shadow:var(--shadow-xs);
}

/* --- 芯片标签 --- */
.chip{
  display:inline-flex;align-items:center;
  padding:var(--space-1) var(--space-3);
  background:var(--bg-tertiary);
  border-radius:var(--radius-pill);
  font-size:12px;font-weight:500;
  color:var(--text-secondary);
  cursor:pointer;
  transition:all var(--transition-fast);
}
.chip:hover{background:var(--border)}
.chip.active{
  background:var(--brand);
  color:#fff;
}

/* --- 开关 --- */
.switch{
  position:relative;
  width:44px;height:24px;
  background:var(--border);
  border-radius:var(--radius-pill);
  cursor:pointer;
  transition:background var(--transition-fast);
  flex-shrink:0;
}
.switch.on{background:var(--brand)}
.switch::after{
  content:'';
  position:absolute;
  top:2px;left:2px;
  width:20px;height:20px;
  background:#fff;
  border-radius:50%;
  transition:transform var(--transition-fast);
  box-shadow:var(--shadow-sm);
}
.switch.on::after{transform:translateX(20px)}

/* --- 横向滚动 --- */
.h-scroll{
  display:flex;
  gap:var(--space-2);
  overflow-x:auto;
  padding-bottom:var(--space-2);
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.h-scroll::-webkit-scrollbar{display:none}

/* --- 两列布局 --- */
.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--space-4);
}

/* --- 图表环形图 --- */
.donut-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:var(--space-4);
}
.donut-wrap svg{
  width:140px;height:140px;
}
.donut-wrap .fill{
  transition:stroke-dashoffset 0.5s ease;
}
.legend{
  display:flex;flex-direction:column;gap:var(--space-2);
  margin-top:var(--space-3);
}
.legend-item{
  display:flex;align-items:center;gap:var(--space-2);
  font-size:12px;color:var(--text-secondary);
}
.legend-dot{
  width:10px;height:10px;
  border-radius:50%;
  flex-shrink:0;
}

/* --- 进度条 --- */
.progress-bar{
  width:100%;height:6px;
  background:var(--bg-tertiary);
  border-radius:var(--radius-pill);
  overflow:hidden;
  margin:var(--space-2) 0;
}
.progress-bar .fill{
  height:100%;
  background:linear-gradient(90deg,var(--brand),#6366F1);
  border-radius:var(--radius-pill);
  transition:width 0.5s ease;
}

/* --- 时间线 --- */
.timeline{
  position:relative;
  padding-left:var(--space-5);
}
.timeline::before{
  content:'';
  position:absolute;
  left:7px;top:8px;bottom:8px;
  width:2px;
  background:var(--border);
}
.timeline-item{
  position:relative;
  padding-bottom:var(--space-4);
}
.timeline-item::before{
  content:'';
  position:absolute;
  left:-22px;top:6px;
  width:12px;height:12px;
  border-radius:50%;
  background:var(--brand);
  border:2px solid var(--bg-secondary);
  box-shadow:0 0 0 2px var(--brand);
}
.timeline-item .tl-date{
  font-size:11px;color:var(--text-tertiary);
  font-weight:500;
  margin-bottom:2px;
}
.timeline-item .tl-title{
  font-size:14px;font-weight:600;
  color:var(--text-primary);
  margin-bottom:2px;
}
.timeline-item .tl-desc{
  font-size:12px;color:var(--text-secondary);
}

/* --- 番茄钟 --- */
.pomo-wrap{
  text-align:center;
  padding:var(--space-6) 0;
}
.pomo-circle{
  position:relative;
  width:200px;height:200px;
  margin:0 auto var(--space-5);
}
.pomo-circle svg{
  width:100%;height:100%;
  transform:rotate(-90deg);
}
.pomo-circle .fill{
  transition:stroke-dashoffset 1s linear;
}
.pomo-center{
  position:absolute;
  inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.pomo-time{
  font-size:42px;font-weight:700;
  color:var(--text-primary);
  line-height:1;
}
.pomo-mode{
  font-size:13px;color:var(--text-tertiary);
  margin-top:var(--space-2);
  font-weight:500;
}
.pomo-round{
  font-size:12px;color:var(--text-tertiary);
  margin-top:4px;
}
.pomo-controls{
  display:flex;justify-content:center;gap:var(--space-3);
  margin-bottom:var(--space-4);
}
.pomo-controls .btn{min-width:100px}
.pomo-settings{
  display:flex;justify-content:center;gap:var(--space-4);
  font-size:12px;color:var(--text-secondary);
}

/* --- 灵感卡片 --- */
.idea-card{
  background:var(--bg-secondary);
  border-radius:var(--radius-lg);
  border:0.5px solid var(--border);
  padding:var(--space-4);
  margin-bottom:var(--space-3);
  box-shadow:var(--shadow-xs);
  transition:all var(--transition-fast);
}
.idea-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.idea-content{
  font-size:14px;color:var(--text-primary);
  line-height:1.6;
  margin-bottom:var(--space-3);
}
.idea-meta{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--text-tertiary);
}
.idea-actions{
  display:flex;gap:var(--space-2);
  margin-top:var(--space-3);
  padding-top:var(--space-3);
  border-top:0.5px solid var(--separator);
}
.idea-actions .btn{flex:1}

/* --- 考勤 --- */
.att-row{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);
  border-bottom:0.5px solid var(--separator);
  background:var(--bg-secondary);
}
.att-row:last-child{border-bottom:none}
.att-student{
  flex:1;
  font-size:14px;font-weight:500;
  color:var(--text-primary);
}
.att-name{
  font-size:14px;font-weight:600;
  color:var(--text-primary);
}
.ae-status{
  display:flex;gap:var(--space-1);
}
.ae-arrive{
  font-size:12px;color:var(--text-secondary);
}
.ae-reason{
  font-size:11px;color:var(--text-tertiary);
  margin-top:2px;
}

/* --- 颜色选择器 --- */
.color-row{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) 0;
}
.color-dot{
  width:28px;height:28px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid transparent;
  transition:all var(--transition-fast);
  flex-shrink:0;
}
.color-dot.selected{
  border-color:var(--text-primary);
  transform:scale(1.1);
}

/* --- 图标选择器 --- */
.icon-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:var(--space-2);
}
.icon-opt{
  width:40px;height:40px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid transparent;
  cursor:pointer;
  transition:all var(--transition-fast);
  color:var(--text-secondary);
  background:var(--bg-primary);
}
.icon-opt:hover{background:var(--bg-tertiary)}
.icon-opt.selected{
  border-color:var(--brand);
  background:var(--brand-tint);
  color:var(--brand);
}
.icon-opt svg{width:18px;height:18px}

/* --- 主题选择器 --- */
.theme-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--space-3);
}
.theme-opt{
  padding:var(--space-3);
  border-radius:var(--radius-md);
  border:1.5px solid var(--border);
  cursor:pointer;
  transition:all var(--transition-fast);
  text-align:center;
  font-size:12px;font-weight:500;
  color:var(--text-secondary);
}
.theme-opt:hover{border-color:var(--brand)}
.theme-opt.active{
  border-color:var(--brand);
  background:var(--brand-tint);
  color:var(--brand);
}

/* --- 搜索结果 --- */
.search-results .list-item{
  border-radius:0;
  border-bottom:0.5px solid var(--separator);
}
.search-results .list-item:first-child{border-radius:0}
.search-results .list-item:last-child{border-radius:0;border-bottom:none}

/* --- 提醒横幅 --- */
.rb-text{
  font-size:14px;font-weight:600;
  color:var(--text-primary);
}
.rb-time{
  font-size:12px;color:var(--text-secondary);
  margin-top:2px;
}

/* --- 通用文字 --- */
.info{
  font-size:12px;color:var(--text-tertiary);
  text-align:center;
  padding:var(--space-3);
}
.msg{
  font-size:13px;color:var(--text-secondary);
  line-height:1.6;
}
.back{
  display:inline-flex;align-items:center;gap:var(--space-1);
  font-size:13px;color:var(--text-secondary);
  cursor:pointer;
  padding:var(--space-2) 0;
}
.back:hover{color:var(--brand)}
.back svg{width:14px;height:14px}
.left{flex:1;min-width:0}
.undo{
  font-size:12px;color:var(--brand);
  font-weight:600;
  cursor:pointer;
  margin-left:var(--space-2);
}

/* --- 响应式 --- */
@media(max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .stats-grid{grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
  .stat-card{padding:var(--space-3)}
  .stat-card .value,.stat-card .number{font-size:18px}
  .two-col{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .icon-grid{grid-template-columns:repeat(5,1fr)}
  .theme-grid{grid-template-columns:repeat(2,1fr)}
  .pomo-circle{width:160px;height:160px}
  .pomo-time{font-size:36px}
}

@media(min-width:768px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
}

@media(min-width:1024px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .icon-grid{grid-template-columns:repeat(8,1fr)}
}

</style>

function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){console.warn('保存失败',e);}}

async function sbReq(table,method,data,params){
  const url=new URL(SB_URL+'/'+table);
  if(params)Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const headers={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
  try{const res=await fetch(url,{method,headers,body:data?JSON.stringify(data):undefined});if(!res.ok)return{error:res.status+' '+res.statusText};return method==='DELETE'?{ok:true}:await res.json();}catch(e){return{error:e.message};}
}

async function syncAll(){
  if(syncStatus==='syncing')return;
  setSyncStatus('syncing');
  let hasError=false;
  for(const table of TABLES){
    const remote=await sbReq(table,'GET',null,{'device_id':'eq.'+deviceId,'select':'*','order':'updated_at.desc'});
    if(remote.error){hasError=true;continue;}
    const localMap={};
    state[table].forEach(r=>{localMap[r.id]=r;});
    remote.forEach(r=>{
      const local=localMap[r.id];
      if(!local||new Date(r.updated_at)>new Date(local.updated_at)){
        state[table]=state[table].filter(x=>x.id!==r.id);
        if(!r.deleted)state[table].push(r);
      }
    });
    const fiveMinAgo=new Date(Date.now()-300000).toISOString();
    const toPush=state[table].filter(r=>r.device_id===deviceId&&new Date(r.updated_at)>new Date(fiveMinAgo));
    for(const rec of toPush){
      const exists=remote.find(r=>r.id===rec.id);
      if(exists)await sbReq(table,'PATCH',rec,{'id':'eq.'+rec.id});
      else await sbReq(table,'POST',rec);
    }
  }
  saveLocal();
  setSyncStatus(hasError?'error':'ok');
  renderAll();
}

function setSyncStatus(s){syncStatus=s;const dot=$('#syncDot'),txt=$('#syncText');if(!dot)return;dot.className='sync-dot '+(s==='ok'?'ok':s==='syncing'?'syncing':s==='error'?'err':'');txt.textContent=s==='ok'?'已同步':s==='syncing'?'同步中...':s==='error'?'同步失败':'未同步';}

function showToast(msg,undoCb){
  const c=$('#toastContainer');const t=document.createElement('div');t.className='toast';
  t.innerHTML=esc(msg)+(undoCb?'<span class="undo">撤销</span>':'');
  c.appendChild(t);
  if(undoCb)t.querySelector('.undo').onclick=()=>{undoCb();t.remove();};
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3000);
}

function navigate(page){
  currentPage=page;
  $$('.page').forEach(p=>p.classList.remove('active'));
  const el=$('#page-'+page);if(el)el.classList.add('active');
  $$('.nav-tab,.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  const titles={dashboard:'首页',inbox:'收件箱',tasks:'待办事项',records:'记录中心',pomodoro:'番茄钟',review:'回顾',finance:'财务记账'};
  const icons={dashboard:'i-home',inbox:'i-inbox',tasks:'i-check',records:'i-book',pomodoro:'i-timer',review:'i-review',finance:'i-wallet'};
  $('#pageTitle').innerHTML=`<svg><use href="#${icons[page]||'i-home'}"/></svg>${titles[page]||'小乐记录'}`;
  renderPage(page);window.scrollTo(0,0);
}

function openSearch(){$('#searchOverlay').classList.add('show');setTimeout(()=>$('#searchInput').focus(),100);}
function closeSearch(){$('#searchOverlay').classList.remove('show');$('#searchInput').value='';$('#searchResults').innerHTML='';}
function doSearch(q){
  if(!q.trim()){$('#searchResults').innerHTML='';return;}
  const results=[];const ql=q.toLowerCase();
  state.ideas.filter(i=>!i.deleted&&i.content.toLowerCase().includes(ql)).forEach(i=>results.push({type:'想法',title:i.content.slice(0,50),desc:'',date:i.created_at}));
  state.tasks.filter(t=>!t.deleted&&(t.title.toLowerCase().includes(ql)||t.note.toLowerCase().includes(ql))).forEach(t=>results.push({type:'待办',title:t.title,desc:t.note,date:t.due_date}));
  state.teaching_records.filter(t=>!t.deleted&&(t.title.toLowerCase().includes(ql)||t.content.toLowerCase().includes(ql))).forEach(t=>results.push({type:'教学',title:t.title||'教学记录',desc:t.content,date:t.date}));
  state.life_records.filter(t=>!t.deleted&&(t.title.toLowerCase().includes(ql)||t.content.toLowerCase().includes(ql))).forEach(t=>results.push({type:'生活',title:t.title,desc:t.content,date:t.date}));
  state.plans.filter(p=>!p.deleted&&(p.title.toLowerCase().includes(ql)||p.description.toLowerCase().includes(ql))).forEach(p=>results.push({type:'计划',title:p.title,desc:p.description,date:p.created_at}));
  state.transactions.filter(t=>!t.deleted&&t.note.toLowerCase().includes(ql)).forEach(t=>results.push({type:'财务',title:fmtMoney(t.amount,t.currency)+(t.note?' - '+t.note:''),desc:t.type==='income'?'收入':'支出',date:t.date}));
  $('#searchResults').innerHTML=results.length?results.map(r=>`<div class="list-item"><div class="icon" style="background:var(--accent-light)"><svg><use href="#i-search"/></svg></div><div class="info"><div class="title">${esc(r.title)}</div><div class="desc">${esc(r.type)} · ${esc(r.desc||'')}</div></div><div class="right"><div class="date">${esc(fmtDate(r.date))}</div></div></div>`).join(''):emptyHTML('i-search','没有找到相关记录','');
}

function renderDashboard(){
  const pendingTasks=state.tasks.filter(t=>!t.deleted&&!t.done).length;
  const todayTasks=state.tasks.filter(t=>!t.deleted&&!t.done&&t.due_date===today()).length;
  const monthTx=state.transactions.filter(t=>!t.deleted&&t.date&&t.date.startsWith(today().slice(0,7)));
  const monthIncome=monthTx.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount||0)*(CURRENCIES.find(c=>c.code===b.currency)?.rate||1),0);
  const monthExpense=monthTx.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount||0)*(CURRENCIES.find(c=>c.code===b.currency)?.rate||1),0);
  const activePlans=state.plans.filter(p=>!p.deleted&&p.status==='active').length;
  const pendingIdeas=state.ideas.filter(i=>!i.deleted&&i.status==='pending').length;

  $('#dashStats').innerHTML=`
    <div class="stat-card"><div class="label">待办事项</div><div class="value">${pendingTasks}</div><div class="sub">今日 ${todayTasks} 项</div></div>
    <div class="stat-card"><div class="label">待处理想法</div><div class="value">${pendingIdeas}</div><div class="sub">收件箱</div></div>
    <div class="stat-card"><div class="label">本月支出</div><div class="value" style="color:var(--danger)">¥${monthExpense.toFixed(0)}</div><div class="sub">折算人民币</div></div>
    <div class="stat-card"><div class="label">进行中计划</div><div class="value">${activePlans}</div><div class="sub">追踪中</div></div>`;

  const tList=state.tasks.filter(t=>!t.deleted&&!t.done&&t.due_date&&t.due_date<=today()).sort((a,b)=>(a.priority||0)-(b.priority||0)).slice(0,5);
  $('#dashTasks').innerHTML=tList.length?tList.map(t=>`<div class="list-item" onclick="toggleTask('${t.id}')"><div class="icon" style="background:var(--card2);color:var(--text3)"><svg><use href="#i-check"/></svg></div><div class="info"><div class="title">${esc(t.title)}</div><div class="desc">${esc(t.category)} · ${esc(fmtDate(t.due_date))}</div></div></div>`).join(''):emptyHTML('i-check','今天没有待办','点右下角 + 添加');

  $('#dashFinance').innerHTML=monthTx.length?`<div style="display:flex;justify-content:space-between;padding:8px 0"><span style="font-size:13px;color:var(--text2)">收入</span><span style="font-weight:700;color:var(--success)">¥${monthIncome.toFixed(0)}</span></div><div style="display:flex;justify-content:space-between;padding:8px 0"><span style="font-size:13px;color:var(--text2)">支出</span><span style="font-weight:700;color:var(--danger)">¥${monthExpense.toFixed(0)}</span></div><div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)"><span style="font-size:13px;font-weight:600">结余</span><span style="font-weight:700;color:${monthIncome-monthExpense>=0?'var(--success)':'var(--danger)'}">¥${(monthIncome-monthExpense).toFixed(0)}</span></div>`:emptyHTML('i-wallet','本月暂无记录','去财务页记一笔');

  const pList=state.plans.filter(p=>!p.deleted).slice(0,3);
  $('#dashProjects').innerHTML=pList.length?pList.map(p=>{const tasks=state.plan_tasks.filter(t=>!t.deleted&&t.plan_id===p.id);const done=tasks.filter(t=>t.completed).length;const pct=tasks.length?Math.round(done/tasks.length*100):0;return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:600">${esc(p.title)}</span><span style="color:var(--text2)">${pct}%</span></div><div class="progress-bar"><div class="fill" style="width:${pct}%;background:${p.color||'var(--accent)'}"></div></div></div>`;}).join(''):emptyHTML('i-rocket','暂无计划','去记录中心创建计划');
}

function renderInbox(){
  const list=state.ideas.filter(i=>!i.deleted&&i.status!=='discarded').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  $('#inboxList').innerHTML=list.length?list.map(i=>`<div class="idea-card"><div class="idea-content">${esc(i.content)}</div><div class="idea-meta"><span>${esc(fmtDate(i.created_at))}</span><span class="tag ${i.status==='converted'?'tag-success':'tag-info'}">${i.status==='converted'?'已转化':'待处理'}</span></div><div class="idea-actions"><button class="btn btn-sm btn-primary" onclick="ideaToTask('${i.id}')">转为待办</button><button class="btn btn-sm btn-secondary" onclick="ideaToPlan('${i.id}')">转为计划</button><button class="btn btn-sm btn-danger" onclick="deleteIdea('${i.id}')">丢弃</button></div></div>`).join(''):emptyHTML('i-inbox','收件箱是空的','有什么想法随时记下来');
}
function openIdeaEdit(){
  openModal('记录想法',`<div class="form-group"><label>想法内容</label><textarea id="idea_content" rows="4" placeholder="有什么想法、灵感、待确认的事..."></textarea></div>`,'',[
    {text:'取消',cls:'btn-secondary',cb:closeModal},
    {text:'保存',cls:'btn-primary',cb:()=>{
      const content=$('#idea_content').value.trim();
      if(!content){showToast('请输入内容');return;}
      state.ideas.push({id:uid(),device_id:deviceId,content,status:'pending',created_at:now(),updated_at:now(),deleted:false});
      saveLocal();closeModal();renderInbox();showToast('已记录');
    }}
  ]);
}
function ideaToTask(id){
  const idea=state.ideas.find(i=>i.id===id);if(!idea)return;
  openTaskEdit(null,idea.content);
  idea.status='converted';idea.updated_at=now();saveLocal();
}
function ideaToPlan(id){
  const idea=state.ideas.find(i=>i.id===id);if(!idea)return;
  openPlanEdit(null,idea.content);
  idea.status='converted';idea.updated_at=now();saveLocal();
}
function deleteIdea(id){
  showConfirm('丢弃想法','确定要丢弃这个想法吗？').then(ok=>{
    if(!ok)return;
    const i=state.ideas.find(x=>x.id===id);
    if(i){i.deleted=true;i.status='discarded';i.updated_at=now();saveLocal();renderInbox();showToast('已丢弃');}
  });
}

function renderTasks(){
  let list=state.tasks.filter(t=>!t.deleted);
  if(taskFilter==='today')list=list.filter(t=>!t.done&&t.due_date===today());
  else if(taskFilter==='pending')list=list.filter(t=>!t.done);
  else if(taskFilter==='done')list=list.filter(t=>t.done);
  list=list.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;return new Date(b.updated_at)-new Date(a.updated_at);});
  $('#taskFilter').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.f===taskFilter));
  $('#taskList').innerHTML=list.length?list.map(t=>`<div class="list-item"><div class="icon" style="background:${t.done?'var(--success)':'var(--card2)'};color:${t.done?'#fff':'var(--text3)'};cursor:pointer" onclick="toggleTask('${t.id}')"><svg><use href="#i-check"/></svg></div><div class="info" onclick="openTaskEdit('${t.id}')"><div class="title" style="${t.done?'text-decoration:line-through;color:var(--text3)':''}">${esc(t.title)}</div><div class="desc">${esc(t.category)}${t.due_date?' · '+esc(fmtDate(t.due_date)):''}${t.remind_at?' · 🔔':''}</div></div><div class="right"><button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();deleteTask('${t.id}')"><svg><use href="#i-trash"/></svg></button></div></div>`).join(''):emptyHTML('i-check','暂无待办','点右下角 + 添加任务');
}
$('#taskFilter').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{taskFilter=b.dataset.f;renderTasks();}));
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.done_at=t.done?now():null;t.updated_at=now();saveLocal();renderAll();if(t.done)showToast('已完成');}
function deleteTask(id){showConfirm('删除任务','确定要删除这个待办吗？').then(ok=>{if(!ok)return;const t=state.tasks.find(x=>x.id===id);if(t){t.deleted=true;t.updated_at=now();saveLocal();renderAll();showToast('已删除');}});}
function openTaskEdit(id,presetTitle){
  const t=id?state.tasks.find(x=>x.id===id):{title:presetTitle||'',note:'',category:'默认',due_date:'',remind_at:'',priority:0};
  if(!t)return;
  openModal(id?'编辑任务':'新建任务',`
    <div class="form-group"><label>任务标题</label><input id="te_title" value="${esc(t.title)}" placeholder="要做什么？"></div>
    <div class="form-row"><div class="form-group"><label>分类</label><input id="te_category" value="${esc(t.category)}" placeholder="如：工作/生活"></div><div class="form-group"><label>优先级</label><select id="te_priority"><option value="0" ${t.priority==0?'selected':''}>普通</option><option value="1" ${t.priority==1?'selected':''}>重要</option><option value="2" ${t.priority==2?'selected':''}>紧急</option></select></div></div>
    <div class="form-row"><div class="form-group"><label>截止日期</label><input type="date" id="te_due" value="${esc(fmtDate(t.due_date))}"></div><div class="form-group"><label>提醒时间</label><input type="datetime-local" id="te_remind" value="${t.remind_at?t.remind_at.slice(0,16):''}"></div></div>
    <div class="form-group"><label>备注</label><textarea id="te_note" placeholder="详细说明...">${esc(t.note)}</textarea></div>
  `,'',[
    {text:'取消',cls:'btn-secondary',cb:closeModal},
    {text:'保存',cls:'btn-primary',cb:()=>{
      const title=$('#te_title').value.trim();if(!title){showToast('请输入标题');return;}
      const data={title,note:$('#te_note').value,category:$('#te_category').value||'默认',due_date:$('#te_due').value||null,remind_at:$('#te_remind').value?$('#te_remind').value+':00':null,reminded:false,priority:Number($('#te_priority').value),updated_at:now()};
      if(id)Object.assign(t,data);
      else state.tasks.push({id:uid(),device_id:deviceId,done:false,done_at:null,sort_order:state.tasks.length,created_at:now(),...data});
      saveLocal();closeModal();renderAll();showToast(id?'已更新':'已添加');
    }}
  ]);
}

function openAttendanceEdit(){
  const classes=state.classes.filter(c=>!c.deleted);

  if(!teachState.attClass)teachState.attClass=classes[0].id;

    openModal('记录考勤',`
      <div class="form-row"><div class="form-group"><label>班级</label><select id="ae_class" onchange="teachState.attClass=this.value;renderAttModal()">${classes.map(c=>`<option value="${c.id}" ${classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="form-group"><label>日期</label><input type="date" id="ae_date" value="${date}" onchange="teachState.attDate=this.value;renderAttModal()"></div></div>

        return `<div class="att-student"><div class="att-name"><span>${esc(s.name)}</span></div><div class="att-row"><select class="ae-status" data-sid="${s.id}"><option value="present" ${att?.status==='present'?'selected':''}>出勤</option><option value="absent" ${att?.status==='absent'?'selected':''}>缺勤</option><option value="late" ${att?.status==='late'?'selected':''}>迟到</option><option value="leave" ${att?.status==='leave'?'selected':''}>请假</option></select><input class="ae-arrive" type="time" data-sid="${s.id}" value="${att?.arrive_time||''}" placeholder="到校时间"><input class="ae-reason" type="text" data-sid="${s.id}" value="${esc(att?.reason||'')}" placeholder="原因"></div></div>`;
      }).join(''):emptyHTML('i-users','这个班级还没有学生','先去班级管理添加学生')}
    `,'',[
      {text:'取消',cls:'btn-secondary',cb:closeModal},
      {text:'保存',cls:'btn-primary',cb:()=>{
        const classId=teachState.attClass;const date=teachState.attDate;
        $$('.att-student').forEach(row=>{
          const sid=row.querySelector('.ae-status').dataset.sid;
          const status=row.querySelector('.ae-status').value;
          const arrive=row.querySelector('.ae-arrive').value;
          const reason=row.querySelector('.ae-reason').value;
          const existing=state.attendance.find(a=>a.student_id===sid&&String(a.date)===date);

      }}
    ]);
  }
  window.renderAttModal=renderModal;
  renderModal();
}

function openPlanDetail(pid){

  const tasks=state.plan_tasks.filter(t=>!t.deleted&&t.plan_id===pid).sort((a,b)=>a.order-b.order);
  const done=tasks.filter(t=>t.completed).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  openModal(p.title,`
    <div style="margin-bottom:12px">
      ${p.description?`<div style="font-size:13px;color:var(--text2);margin-bottom:6px">${esc(p.description)}</div>`:''}
      ${p.goal?`<div style="font-size:12px;color:var(--text3);margin-bottom:6px">目标: ${esc(p.goal)}</div>`:''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="tag tag-info">${done}/${tasks.length} 完成</span><span class="tag ${p.priority==='high'?'tag-danger':p.priority==='medium'?'tag-warning':'tag-info'}">${p.priority==='high'?'高优先级':p.priority==='medium'?'中优先级':'低优先级'}</span></div>
      <div class="progress-bar" style="margin-top:8px"><div class="fill" style="width:${pct}%;background:${p.color||'var(--accent)'}"></div></div>
    </div>
    <div style="font-size:13px;font-weight:700;margin-bottom:8px">任务清单</div>
    ${tasks.length?tasks.map(t=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><div style="width:22px;height:22px;border-radius:50%;border:2px solid ${t.completed?'var(--success)':'var(--border)'};display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:${t.completed?'var(--success)':'transparent'}" onclick="togglePlanTask('${t.id}')">${t.completed?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}</div><div style="flex:1;font-size:13px;${t.completed?'text-decoration:line-through;color:var(--text3)':''}">${esc(t.title)}</div><button class="btn btn-sm btn-secondary" style="padding:4px 8px" onclick="deletePlanTask('${t.id}')"><svg width="12" height="12"><use href="#i-trash"/></svg></button></div>`).join(''):emptyHTML('i-list','还没有任务','添加任务开始执行')}
    <div style="display:flex;gap:8px;margin-top:12px"><input id="new_task_title" type="text" placeholder="添加任务..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card2);color:var(--text)"><button class="btn btn-sm btn-primary" onclick="addPlanTask('${pid}')"><svg><use href="#i-plus"/></svg></button></div>
  `,'',[{text:'关闭',cls:'btn-secondary',cb:closeModal},{text:'编辑计划',cls:'btn-primary',cb:()=>{closeModal();openPlanEdit(pid);}}]);
}
function togglePlanTask(id){
  const t=state.plan_tasks.find(x=>x.id===id);if(!t)return;
  t.completed=!t.completed;t.completed_at=t.completed?now():null;t.updated_at=now();
  saveLocal();
  const p=state.plans.find(p=>p.id===t.plan_id);
  if(p){const tasks=state.plan_tasks.filter(x=>!x.deleted&&x.plan_id===p.id);const done=tasks.filter(x=>x.completed).length;if(done===tasks.length&&tasks.length>0){p.status='completed';}p.updated_at=now();}
  openPlanDetail(t.plan_id);
}
function addPlanTask(pid){
  const input=$('#new_task_title');const title=input?.value.trim();
  if(!title){showToast('请输入任务内容');return;}
  const order=state.plan_tasks.filter(t=>!t.deleted&&t.plan_id===pid).length;
  state.plan_tasks.push({id:uid(),device_id:deviceId,plan_id:pid,title,completed:false,order,created_at:now(),updated_at:now(),deleted:false});
  saveLocal();openPlanDetail(pid);
}
function deletePlanTask(id){
  const t=state.plan_tasks.find(x=>x.id===id);if(!t)return;
  t.deleted=true;t.updated_at=now();saveLocal();openPlanDetail(t.plan_id);
}

function getDefaultBook(){
  if(!finState.currentBook){
    const b=state.books.find(b=>!b.deleted&&b.is_default)||state.books.find(b=>!b.deleted);
    if(b)finState.currentBook=b.id;
  }
  return finState.currentBook;
}
function ensureBook(){
  if(state.books.filter(b=>!b.deleted).length===0){
    const id=uid();
    state.books.push({id,device_id:deviceId,name:'日常账本',currency:'MMK',icon:'i-wallet',color:'#e67e22',is_default:true,created_at:now(),updated_at:now()});
    state.accounts.push({id:uid(),device_id:deviceId,book_id:id,name:'现金',type:'cash',balance:0,currency:'MMK',icon:'i-wallet',color:'#27ae60',sort_order:0,created_at:now(),updated_at:now()});
    state.accounts.push({id:uid(),device_id:deviceId,book_id:id,name:'银行卡',type:'bank',balance:0,currency:'MMK',icon:'i-credit-card',color:'#3498db',sort_order:1,created_at:now(),updated_at:now()});
    const expCats=[['餐饮','i-utensils','#e74c3c'],['交通','i-car','#3498db'],['购物','i-shopping','#9b59b6'],['娱乐','i-game','#f39c12'],['居住','i-home','#1abc9c'],['医疗','i-medical','#e74c3c'],['教育','i-graduation','#3498db'],['其他','i-star','#95a5a6']];
    const incCats=[['工资','i-briefcase','#27ae60'],['奖金','i-gift','#f39c12'],['投资','i-chart','#3498db'],['兼职','i-briefcase','#9b59b6'],['其他','i-star','#95a5a6']];
    expCats.forEach((c,i)=>state.categories.push({id:uid(),device_id:deviceId,book_id:id,type:'expense',name:c[0],icon:c[1],color:c[2],sort_order:i,is_default:true,created_at:now(),updated_at:now()}));
    incCats.forEach((c,i)=>state.categories.push({id:uid(),device_id:deviceId,book_id:id,type:'income',name:c[0],icon:c[1],color:c[2],sort_order:i,is_default:true,created_at:now(),updated_at:now()}));
    finState.currentBook=id;
    saveLocal();
  }
}

      <div id="fx_result" style="text-align:center;padding:16px;background:var(--card2);border-radius:12px;font-size:20px;font-weight:700"></div></div>
      <div class="card"><div class="card-title"><svg><use href="#i-calc"/></svg>贷款计算器</div>
      <div class="form-row"><div class="form-group"><label>贷款金额</label><input type="number" id="loan_amount" value="100000" oninput="calcLoan()"></div><div class="form-group"><label>年利率(%)</label><input type="number" id="loan_rate" value="5" step="0.1" oninput="calcLoan()"></div></div>
      <div class="form-group"><label>期数（月）</label><input type="number" id="loan_months" value="12" oninput="calcLoan()"></div>
      <div id="loan_result" style="padding:12px;background:var(--card2);border-radius:12px;font-size:13px"></div></div>`;
    setTimeout(()=>{doFX();calcLoan();},50);
  }
}
function doFX(){const amt=Number($('#fx_amount')?.value||0);const from=CURRENCIES.find(c=>c.code===$('#fx_from')?.value);const to=CURRENCIES.find(c=>c.code===$('#fx_to')?.value);if(!from||!to||!$('#fx_result'))return;const cny=amt*from.rate;const result=cny/to.rate;$('#fx_result').textContent=`${from.symbol}${amt.toLocaleString()} = ${to.symbol}${result.toLocaleString(undefined,{minimumFractionDigits:to.decimals,maximumFractionDigits:to.decimals})}`;}
function calcLoan(){const P=Number($('#loan_amount')?.value||0);const annual=Number($('#loan_rate')?.value||0)/100;const n=Number($('#loan_months')?.value||1);if(!$('#loan_result')||!P||!n)return;const r=annual/12;let monthly,total;if(r===0){monthly=P/n;total=P;}else{monthly=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);total=monthly*n;}const interest=total-P;$('#loan_result').innerHTML=`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>月供</span><span style="font-weight:700">¥${monthly.toFixed(2)}</span></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>总还款</span><span style="font-weight:700">¥${total.toFixed(2)}</span></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>总利息</span><span style="font-weight:700;color:var(--danger)">¥${interest.toFixed(2)}</span></div>`;}
