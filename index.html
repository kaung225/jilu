<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="description" content="旭哥记录 - 个人全场景记录工具">
<title>旭哥记录 · 个人工作台</title>
<link rel="manifest" href="./manifest.json">
<style>
/* ========== 设计系统 ========== */
:root{
  --brand:#4F46E5;--brand-light:#EEF2FF;--brand-dark:#4338CA;
  --bg:#F8FAFC;--bg-card:#FFFFFF;--bg-hover:#F1F5F9;
  --text:#0F172A;--text2:#64748B;--text3:#94A3B8;
  --border:#E2E8F0;--separator:#F1F5F9;
  --success:#10B981;--warning:#F59E0B;--danger:#EF4444;--info:#3B82F6;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font-sans);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;overflow-x:hidden;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:var(--brand);text-decoration:none;}

/* ========== 顶部导航 ========== */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--separator);
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-title{font-size:18px;font-weight:700;}
.topbar-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-hover);color:var(--text2);
  transition:all .2s;
}
.icon-btn:hover{background:var(--brand-light);color:var(--brand);}
.icon-btn svg{width:20px;height:20px;}

/* ========== 底部导航 ========== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);
  border-top:1px solid var(--separator);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 16px;border-radius:12px;
  color:var(--text3);transition:all .2s;
}
.nav-item.active{color:var(--brand);}
.nav-item svg{width:22px;height:22px;}
.nav-item span{font-size:11px;font-weight:500;}
.nav-fab{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-lg);transform:translateY(-12px);
  transition:transform .2s;
}
.nav-fab:hover{transform:translateY(-12px) scale(1.05);}
.nav-fab svg{width:24px;height:24px;}

/* ========== 页面容器 ========== */
.page{display:none;min-height:calc(100vh - 140px);}
.page.active{display:block;}
.page-content{padding:16px;}

/* ========== 首页 ========== */
.greeting{padding:20px 16px 12px;}
.greet-text{font-size:24px;font-weight:700;}
.greet-sub{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--text2);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--success);}

.stats-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  padding:0 16px;margin-bottom:20px;
}
.stat-card{
  background:var(--bg-card);border-radius:var(--radius-lg);
  padding:16px;box-shadow:var(--shadow-sm);
  border:1px solid var(--separator);
  text-align:left;transition:all .2s;
  display:flex;flex-direction:column;gap:4px;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--brand);}
.stat-card:active{transform:scale(.98);}
.stat-label{font-size:12px;color:var(--text2);font-weight:500;}
.stat-value{font-size:24px;font-weight:700;color:var(--text);}
.stat-sub{font-size:11px;color:var(--text3);}

.section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;margin-bottom:12px;
}
.section-title{font-size:16px;font-weight:600;}
.section-action{
  display:flex;align-items:center;gap:4px;
  font-size:13px;color:var(--brand);font-weight:500;
}
.section-action svg{width:14px;height:14px;}

.quick-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  padding:0 16px;margin-bottom:20px;
}
.quick-item{
  background:var(--bg-card);border-radius:var(--radius-lg);
  padding:16px 8px;box-shadow:var(--shadow-sm);
  border:1px solid var(--separator);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:all .2s;
}
.quick-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.quick-item:active{transform:scale(.95);}
.qi-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}
.qi-icon svg{width:22px;height:22px;}
.qi-name{font-size:12px;font-weight:500;color:var(--text);}

.recent-card{
  margin:0 16px 20px;background:var(--bg-card);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  border:1px solid var(--separator);overflow:hidden;
}
.empty-state{padding:40px 20px;text-align:center;}
.es-icon{
  width:56px;height:56px;border-radius:16px;
  background:var(--bg-hover);display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;color:var(--text3);
}
.es-icon svg{width:28px;height:28px;}
.es-title{font-size:15px;font-weight:600;margin-bottom:4px;}
.es-desc{font-size:13px;color:var(--text2);margin-bottom:16px;}
.es-cta{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 20px;border-radius:10px;
  background:var(--brand);color:#fff;font-weight:500;font-size:13px;
  transition:all .2s;
}
.es-cta:hover{background:var(--brand-dark);}
.es-cta svg{width:16px;height:16px;}

/* ========== 板块卡片导航 ========== */
.section-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  padding:0 16px;
}
.section-card{
  background:var(--bg-card);border-radius:var(--radius-lg);
  padding:16px;box-shadow:var(--shadow-sm);
  border:1px solid var(--separator);
  display:flex;align-items:center;gap:12px;
  text-align:left;transition:all .2s;
}
.section-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--brand);}
.section-card:active{transform:scale(.98);}
.sc-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.sc-icon svg{width:22px;height:22px;}
.sc-content{flex:1;min-width:0;}
.sc-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.sc-desc{font-size:11px;color:var(--text2);}
.sc-stat{font-size:11px;color:var(--brand);font-weight:600;margin-top:4px;}
.sc-arrow{color:var(--text3);flex-shrink:0;}
.sc-arrow svg{width:18px;height:18px;}

/* 板块颜色 */
.sc-teaching .sc-icon{background:#DBEAFE;color:#2563EB;}
.sc-life .sc-icon{background:#FEF3C7;color:#D97706;}
.sc-study .sc-icon{background:#E0E7FF;color:#4F46E5;}
.sc-project .sc-icon{background:#D1FAE5;color:#059669;}
.sc-plans .sc-icon{background:#FEE2E2;color:#DC2626;}
.fc-overview .sc-icon{background:#DBEAFE;color:#2563EB;}
.fc-accounts .sc-icon{background:#E0E7FF;color:#4F46E5;}
.fc-records .sc-icon{background:#D1FAE5;color:#059669;}
.fc-budget .sc-icon{background:#FEF3C7;color:#D97706;}
.fc-saving .sc-icon{background:#D1FAE5;color:#059669;}
.fc-debt .sc-icon{background:#FEE2E2;color:#DC2626;}
.fc-category .sc-icon{background:#F3F4F6;color:#6B7280;}

/* ========== 子页面 ========== */
.subpage-header{
  display:flex;align-items:center;gap:12px;
  padding:16px;border-bottom:1px solid var(--separator);
  background:var(--bg-card);
}
.back-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-hover);color:var(--text2);
  transition:all .2s;flex-shrink:0;
}
.back-btn:hover{background:var(--brand-light);color:var(--brand);}
.back-btn svg{width:20px;height:20px;}
.subpage-title{font-size:18px;font-weight:700;}
.subpage-breadcrumb{font-size:12px;color:var(--text2);margin-top:2px;}
.subpage-actions{margin-left:auto;display:flex;gap:8px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:10px;
  font-size:14px;font-weight:500;transition:all .2s;
}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-secondary{background:var(--bg-hover);color:var(--text);}
.btn-secondary:hover{background:var(--border);}
.btn-sm{padding:8px 14px;font-size:13px;}
.btn-block{width:100%;}
.btn svg{width:16px;height:16px;}

/* ========== 列表项 ========== */
.list-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:var(--bg-card);
  border-bottom:1px solid var(--separator);
  transition:background .15s;
}
.list-item:hover{background:var(--bg-hover);}
.list-item:active{background:var(--brand-light);}
.list-item .icon{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.list-item .icon svg{width:18px;height:18px;}
.list-item .info{flex:1;min-width:0;}
.list-item .title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-item .desc{font-size:12px;color:var(--text2);margin-top:2px;}
.list-item .right{flex-shrink:0;display:flex;align-items:center;gap:8px;}
.list-item .amount{font-size:15px;font-weight:700;}
.list-item .amount.expense{color:var(--danger);}
.list-item .amount.income{color:var(--success);}
.list-item .date{font-size:11px;color:var(--text3);}

/* ========== 卡片 ========== */
.card{
  background:var(--bg-card);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);border:1px solid var(--separator);
  margin-bottom:16px;overflow:hidden;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--separator);
}
.card-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
.card-title svg{width:18px;height:18px;color:var(--brand);}
.card-body{padding:16px;}

/* ========== 表单 ========== */
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px;font-size:14px;background:var(--bg-card);
  color:var(--text);transition:border-color .2s;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light);
}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ========== 模态框 ========== */
.modal-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);
  display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--bg-card);width:100%;max-width:500px;
  border-radius:20px 20px 0 0;max-height:85vh;overflow-y:auto;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px;border-bottom:1px solid var(--separator);
  position:sticky;top:0;background:var(--bg-card);z-index:1;
}
.modal-title{font-size:17px;font-weight:700;}
.modal-close{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-hover);color:var(--text2);
}
.modal-close svg{width:18px;height:18px;}
.modal-body{padding:16px;}
.modal-footer{
  display:flex;gap:12px;padding:16px;border-top:1px solid var(--separator);
  position:sticky;bottom:0;background:var(--bg-card);
}
.modal-footer .btn{flex:1;}

/* ========== 分类管理 ========== */
.category-list{padding:0 16px;}
.category-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--separator);
}
.category-item:last-child{border-bottom:none;}
.cat-icon{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.cat-icon svg{width:18px;height:18px;}
.cat-name{flex:1;font-size:14px;font-weight:500;}
.cat-actions{display:flex;gap:8px;}
.cat-edit,.cat-delete{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.cat-edit{background:var(--brand-light);color:var(--brand);}
.cat-delete{background:#FEE2E2;color:var(--danger);}
.cat-edit svg,.cat-delete svg{width:16px;height:16px;}

.icon-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
}
.icon-opt{
  aspect-ratio:1;border-radius:10px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;color:var(--text2);
}
.icon-opt:hover{border-color:var(--brand);color:var(--brand);}
.icon-opt.selected{border-color:var(--brand);background:var(--brand-light);color:var(--brand);}
.icon-opt svg{width:20px;height:20px;}

.color-picker{display:flex;flex-wrap:wrap;gap:10px;}
.color-dot{
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  border:3px solid transparent;transition:all .2s;
}
.color-dot.selected{border-color:var(--text);transform:scale(1.1);}

/* ========== 标签 ========== */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;
}
.tag-success{background:#D1FAE5;color:#059669;}
.tag-danger{background:#FEE2E2;color:#DC2626;}
.tag-warning{background:#FEF3C7;color:#D97706;}
.tag-info{background:#DBEAFE;color:#2563EB;}

/* ========== Toast ========== */
.toast-container{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;
}
.toast{
  background:var(--text);color:#fff;padding:10px 20px;
  border-radius:10px;font-size:13px;font-weight:500;
  box-shadow:var(--shadow-lg);animation:slideDown .3s ease;
}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* ========== 响应式 ========== */
@media(min-width:768px){
  body{padding-bottom:0;}
  .bottom-nav{display:none;}
  .stats-grid{grid-template-columns:repeat(3,1fr);max-width:800px;margin:0 auto 20px;}
  .quick-grid{grid-template-columns:repeat(4,1fr);max-width:800px;margin:0 auto 20px;}
  .section-grid{grid-template-columns:repeat(3,1fr);max-width:900px;margin:0 auto;}
  .page-content{max-width:900px;margin:0 auto;}
  .modal-overlay{align-items:center;}
  .modal{border-radius:20px;}
}
@media(min-width:1024px){
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .section-grid{grid-template-columns:repeat(3,1fr);}
}

/* ========== 主题 ========== */
body[data-theme="sunny"]{--brand:#F59E0B;--brand-light:#FEF3C7;--brand-dark:#D97706;}
body[data-theme="deepsea"]{--brand:#0EA5E9;--brand-light:#E0F2FE;--brand-dark:#0284C7;--bg:#0F172A;--bg-card:#1E293B;--text:#F8FAFC;--text2:#94A3B8;--border:#334155;--separator:#1E293B;--bg-hover:#334155;}
body[data-theme="forest"]{--brand:#059669;--brand-light:#D1FAE5;--brand-dark:#047857;}
body[data-theme="sakura"]{--brand:#EC4899;--brand-light:#FCE7F3;--brand-dark:#DB2777;}
body[data-theme="night"]{--brand:#8B5CF6;--brand-light:#EDE9FE;--brand-dark:#7C3AED;--bg:#0F172A;--bg-card:#1E293B;--text:#F8FAFC;--text2:#94A3B8;--border:#334155;--separator:#1E293B;--bg-hover:#334155;}
body[data-theme="gold"]{--brand:#D4AF37;--brand-light:#FEF9C3;--brand-dark:#B8941F;--bg:#1a1408;--bg-card:#2a1f0e;--text:#FEF3C7;--text2:#D4AF37;--border:#4a3a1a;--separator:#2a1f0e;--bg-hover:#4a3a1a;}
body[data-theme="neon"]{--brand:#00FFFF;--brand-light:#0a0a1a;--brand-dark:#00CED1;--bg:#0a0a1a;--bg-card:#151530;--text:#00FFFF;--text2:#00CED1;--border:#2a2a5a;--separator:#151530;--bg-hover:#2a2a5a;}
body[data-theme="sunset"]{--brand:#FF6B35;--brand-light:#F7E8E0;--brand-dark:#E55A2B;}
body[data-theme="mint"]{--brand:#00B894;--brand-light:#D1FAE5;--brand-dark:#00A384;}
</style>

<!-- 顶部导航 -->
<header class="topbar">
  <div>
    <div class="topbar-title" id="topbarTitle">旭哥记录</div>
    <div class="topbar-sub" id="topbarSub">今天也要好好记录</div>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" onclick="openSearch()" aria-label="搜索"><svg><use href="#i-search"/></svg></button>
    <button class="icon-btn" onclick="switchPage('settings')" aria-label="设置"><svg><use href="#i-settings"/></svg></button>
  </div>
</header>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<!-- 首页 -->
<main class="page active" id="page-dashboard">
  <div class="greeting">
    <div class="greet-text" id="greetText">你好，旭哥</div>
    <div class="greet-sub">
      <span class="sync-dot" id="syncDot"></span>
      <span id="greetDate"></span>
    </div>
  </div>

  <div class="stats-grid">
    <button class="stat-card" onclick="switchPage('records');setTimeout(()=>openRecordsSub('life'),100)">
      <div class="stat-label">待办</div>
      <div class="stat-value" id="statTasks">0</div>
      <div class="stat-sub">项未完成</div>
    </button>
    <button class="stat-card" onclick="switchPage('records');setTimeout(()=>openRecordsSub('teaching'),100)">
      <div class="stat-label">教学</div>
      <div class="stat-value" id="statTeaching">0</div>
      <div class="stat-sub">个班级</div>
    </button>
    <button class="stat-card" onclick="switchPage('finance');setTimeout(()=>openFinanceSub('overview'),100)">
      <div class="stat-label">今日支出</div>
      <div class="stat-value" id="statExpense">¥0</div>
      <div class="stat-sub">今天</div>
    </button>
  </div>

  <div class="section-header">
    <div class="section-title">快速记录</div>
  </div>
  <div class="quick-grid">
    <button class="quick-item qi-teaching" onclick="openTeachingQuickAdd()">
      <div class="qi-icon" style="background:#DBEAFE;color:#2563EB"><svg><use href="#i-book"/></svg></div>
      <div class="qi-name">教学记录</div>
    </button>
    <button class="quick-item qi-task" onclick="openTaskEdit()">
      <div class="qi-icon" style="background:#FEF3C7;color:#D97706"><svg><use href="#i-check"/></svg></div>
      <div class="qi-name">添加待办</div>
    </button>
    <button class="quick-item qi-finance" onclick="switchPage('finance');setTimeout(()=>openTransactionEdit(),100)">
      <div class="qi-icon" style="background:#D1FAE5;color:#059669"><svg><use href="#i-wallet"/></svg></div>
      <div class="qi-name">记一笔账</div>
    </button>
    <button class="quick-item qi-idea" onclick="openIdeaEdit()">
      <div class="qi-icon" style="background:#E0E7FF;color:#4F46E5"><svg><use href="#i-bolt"/></svg></div>
      <div class="qi-name">记录灵感</div>
    </button>
  </div>

  <div class="section-header">
    <div class="section-title">最近记录</div>
    <button class="section-action" onclick="switchPage('records')">查看全部 <svg><use href="#i-chevron-right"/></svg></button>
  </div>
  <div class="recent-card" id="dashRecent">
    <div class="empty-state">
      <div class="es-icon"><svg><use href="#i-book"/></svg></div>
      <div class="es-title">还没有记录</div>
      <div class="es-desc">从一条待办、教学记录或一笔支出开始</div>
      <button class="es-cta" onclick="openTaskEdit()"><svg><use href="#i-plus"/></svg><span>写下第一条</span></button>
    </div>
  </div>
</main>

<!-- 记录中心 -->
<section class="page" id="page-records">
  <!-- 板块首页 -->
  <div id="recordsHome">
    <div class="subpage-header">
      <div>
        <div class="subpage-title">记录中心</div>
        <div class="subpage-breadcrumb">选择一个板块进入</div>
      </div>
    </div>
    <div class="section-grid" style="padding-top:16px;">
      <button class="section-card sc-teaching" onclick="openRecordsSub('teaching')">
        <div class="sc-icon"><svg><use href="#i-book"/></svg></div>
        <div class="sc-content">
          <div class="sc-name">教学记录</div>
          <div class="sc-desc">班级、学生、考勤、作业</div>
          <div class="sc-stat" id="scTeaching">0 班级</div>
        </div>
        <div class="sc-arrow"><svg><use href="#i-chevron-right"/></svg></div>
      </button>
      <button class="section-card sc-life" onclick="openRecordsSub('life')">
        <div class="sc-icon"><svg><use href="#i-heart"/></svg></div>
        <div class="sc-content">
          <div class="sc-name">生活记录</div>
          <div class="sc-desc">待办、日记、灵感</div>
          <div class="sc-stat" id="scLife">0 待办</div>
        </div>
        <div class="sc-arrow"><svg><use href="#i-chevron-right"/></svg></div>
      </button>
      <button class="section-card sc-study" onclick="openRecordsSub('study')">
        <div class="sc-icon"><svg><use href="#i-graduation"/></svg></div>

<script>
// ========== 配置 ==========
const SB_URL = 'https://bxhjmzvkmiipnjkdyprx.supabase.co/rest/v1';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4aGptenZrbWlpcG5qa2R5cHJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MTE0NzcsImV4cCI6MjA5MjM4NzQ3N30.U-cn_zT2cmD12-8NOFVfsJRShGMzl3S7a-2yrfDF6Dc';
const LS_KEY = 'xuge_records_v10';
const DEVICE_KEY = 'xuge_device_v10';

// ========== 工具函数 ==========
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)});
const now = () => new Date().toISOString();
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? String(d).slice(0,10) : '';

// ========== 数据状态 ==========
let state = {
  settings: {theme:'default'},
  ideas: [], tasks: [], classes: [], students: [], attendance: [],
  teaching_records: [], life_records: [], subjects: [], study_records: [],
  projects: [], project_updates: [], plans: [], plan_tasks: [], pomodoro_sessions: [],
  books: [], accounts: [], categories: [], transactions: [], budgets: [],
  savings: [], saving_records: [], debts: [], debt_payments: []
};
let deviceId = localStorage.getItem(DEVICE_KEY);
if(!deviceId){ deviceId = uid(); localStorage.setItem(DEVICE_KEY, deviceId); }
let currentPage = 'dashboard';
let currentSub = {records:'', finance:''};
let syncStatus = 'idle';
let catEditState = {icon:'i-coffee', color:'#F59E0B'};

// ========== 数据持久化 ==========
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('保存失败', e); }
}
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    for(const k in d){ if(state[k] !== undefined) state[k] = d[k]; }
    // 确保所有数组字段都是数组
    const arrayFields = ['ideas','tasks','classes','students','attendance','teaching_records','life_records','subjects','study_records','projects','project_updates','plans','plan_tasks','pomodoro_sessions','books','accounts','categories','transactions','budgets','savings','saving_records','debts','debt_payments'];
    arrayFields.forEach(f => { if(!Array.isArray(state[f])) state[f] = []; });
    if(typeof state.settings !== 'object' || state.settings === null) state.settings = {};
  }
  catch(e){ console.warn('读取失败', e); }
}

// ========== Supabase 同步 ==========
async function sbReq(table, method, data, params){
  const url = new URL(SB_URL + '/' + table);
  if(params) Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const headers = {'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json', 'Prefer':'return=representation'};
  try{
    const res = await fetch(url, {method, headers, body:data?JSON.stringify(data):undefined});
    if(!res.ok) return {error:res.status+' '+res.statusText};
    return method==='DELETE' ? {ok:true} : await res.json();
  }catch(e){ return {error:e.message}; }
}

async function syncAll(){
  if(syncStatus === 'syncing') return;
  syncStatus = 'syncing';
  updateSyncDot('syncing');
  const tables = Object.keys(state).filter(k => Array.isArray(state[k]));
  let hasError = false;
  for(const table of tables){
    const remote = await sbReq(table, 'GET', null, {'device_id':'eq.'+deviceId, 'select':'*', 'order':'updated_at.desc'});
    if(remote.error){ hasError = true; continue; }
    const localMap = {};
    state[table].forEach(r => localMap[r.id] = r);
    remote.forEach(r => {
      const local = localMap[r.id];
      if(!local || new Date(r.updated_at) > new Date(local.updated_at)){
        state[table] = state[table].filter(x => x.id !== r.id);
        if(!r.deleted) state[table].push(r);
      }
    });
    const fiveMinAgo = new Date(Date.now()-300000).toISOString();
    const toPush = state[table].filter(r => r.device_id === deviceId && new Date(r.updated_at) > new Date(fiveMinAgo));
    for(const rec of toPush){
      const exists = remote.find(r => r.id === rec.id);
      if(exists) await sbReq(table, 'PATCH', rec, {'id':'eq.'+rec.id});
      else await sbReq(table, 'POST', rec);
    }
  }
  saveLocal();
  syncStatus = hasError ? 'error' : 'ok';
  updateSyncDot(syncStatus);
}

function updateSyncDot(status){
  const dot = $('#syncDot');
  if(!dot) return;
  dot.style.background = status === 'ok' ? '#10B981' : status === 'syncing' ? '#F59E0B' : status === 'error' ? '#EF4444' : '#94A3B8';
}

function syncNow(){
  syncAll().then(() => showToast(syncStatus === 'ok' ? '同步完成' : '同步失败，请检查网络'));
}

// ========== 页面导航 ==========
function switchPage(page){
  $$('.page').forEach(p => p.classList.remove('active'));
  const el = $('#page-'+page);
  if(el) el.classList.add('active');
  currentPage = page;
  $$('.nav-item').forEach(t => t.classList.toggle('active', t.dataset.page === page));
  const titles = {dashboard:'旭哥记录', records:'记录中心', finance:'财务中心', tools:'工具中心', settings:'我的'};
  const subs = {dashboard:'今天也要好好记录', records:'教学·生活·学习·项目', finance:'记账·预算·储蓄·债务', tools:'实用工具集合', settings:'个人设置与数据'};
  $('#topbarTitle').textContent = titles[page] || '旭哥记录';
  $('#topbarSub').textContent = subs[page] || '';
  if(page === 'dashboard') renderDashboard();
  if(page === 'records'){
    if(!currentSub.records){ showRecordsHome(); }
    else { renderRecordsSub(); }
  }
  if(page === 'finance'){
    if(!currentSub.finance){ showFinanceHome(); }
    else if(currentSub.finance === 'categories'){ showCategoryManager(); }
    else { renderFinanceSub(); }
  }
  if(page === 'settings'){ $('#deviceIdDisplay').textContent = deviceId; }
  window.scrollTo(0,0);
}

// ========== 记录中心 ==========
function showRecordsHome(){
  $('#recordsHome').style.display = 'block';
  $('#recordsSub').style.display = 'none';
  $('#categoryManager').style.display = 'none';
  updateRecordsStats();
}
function openRecordsSub(sub){
  currentSub.records = sub;
  $('#recordsHome').style.display = 'none';
  $('#recordsSub').style.display = 'block';
  $('#categoryManager').style.display = 'none';
  const titles = {teaching:'教学记录', life:'生活记录', study:'学习追踪', project:'项目管理', plans:'计划管理'};
  $('#recordsSubTitle').textContent = titles[sub] || '记录';
  $('#recordsBreadcrumb').textContent = '记录中心 / ' + (titles[sub] || '记录');
  renderRecordsSub();
}
function backToRecordsHome(){
  currentSub.records = '';
  showRecordsHome();
}
function updateRecordsStats(){
  $('#scTeaching').textContent = (state.classes||[]).filter(c=>!c.deleted).length + ' 班级';
  $('#scLife').textContent = (state.tasks||[]).filter(t=>!t.deleted&&!t.done).length + ' 待办';

function openTaskEdit(id){
  const t = id ? state.tasks.find(x=>x.id===id) : {title:'', note:'', category:'默认', due_date:'', priority:0};
  if(!t) return;
  openModal(id?'编辑任务':'新建任务', `
    <div class="form-group"><label>任务标题</label><input id="te_title" value="${esc(t.title)}" placeholder="要做什么？"></div>
    <div class="form-row"><div class="form-group"><label>分类</label><input id="te_category" value="${esc(t.category)}" placeholder="如：工作/生活"></div><div class="form-group"><label>优先级</label><select id="te_priority"><option value="0" ${t.priority==0?'selected':''}>普通</option><option value="1" ${t.priority==1?'selected':''}>重要</option><option value="2" ${t.priority==2?'selected':''}>紧急</option></select></div></div>
    <div class="form-group"><label>截止日期</label><input type="date" id="te_due" value="${fmtDate(t.due_date)}"></div>
    <div class="form-group"><label>备注</label><textarea id="te_note" rows="2">${esc(t.note)}</textarea></div>
  `, [
    {text:'取消', cls:'btn-secondary', cb:closeModal},
    {text:'保存', cls:'btn-primary', cb:()=>{
      const title = $('#te_title').value.trim();
      if(!title){ showToast('请输入标题'); return; }
      const data = {title, note:$('#te_note').value, category:$('#te_category').value||'默认', due_date:$('#te_due').value||null, priority:Number($('#te_priority').value), updated_at:now()};
      if(id) Object.assign(t, data);
      else state.tasks.push({id:uid(), device_id:deviceId, done:false, done_at:null, created_at:now(), ...data});
      saveLocal(); closeModal(); renderRecordsSub(); renderDashboard(); showToast(id?'任务已更新':'任务已添加');
    }}
  ]);
}
function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  t.done_at = t.done ? now() : null;
  t.updated_at = now();
  saveLocal(); renderRecordsSub(); renderDashboard();
  showToast(t.done?'已完成':'已恢复');
}
function deleteTask(id){
  showConfirm('删除任务', '确定要删除这个待办吗？', ()=>{
    const t = state.tasks.find(x=>x.id===id);
    if(t){ t.deleted = true; t.updated_at = now(); saveLocal(); renderRecordsSub(); renderDashboard(); showToast('已删除'); }
  });
}

function openTransactionEdit(id){
  const t = id ? state.transactions.find(x=>x.id===id) : {type:'expense', amount:0, account_id:'', category_id:'', date:today(), note:''};

// ========== 分类管理 ==========
const CATEGORY_ICONS = ['i-coffee','i-car','i-briefcase','i-bolt','i-home','i-heart','i-graduation','i-wallet','i-chart','i-calendar','i-clock','i-book','i-rocket','i-exchange','i-download','i-camera','i-credit-card','i-utensils','i-shopping','i-gift','i-game','i-plane','i-medical','i-lightbulb','i-music','i-fitness','i-science','i-language','i-calc','i-piggy','i-handshake','i-target','i-bell','i-inbox','i-timer','i-list','i-review','i-star','i-flag','i-bookmark','i-users','i-star'];
const CATEGORY_COLORS = ['#F59E0B','#3B82F6','#8B5CF6','#EC4899','#10B981','#EF4444','#06B6D4','#64748B','#F97316','#84CC16','#14B8A6','#F43F5E','#0EA5E9','#8B5CF6','#F59E0B','#10B981'];

function openCategoryManager(){
  currentSub.finance = 'categories';
  $('#financeHome').style.display = 'none';
  $('#financeSub').style.display = 'none';
  $('#categoryManager').style.display = 'block';
  renderCategoryManager();
}
function renderCategoryManager(){
  const expenseCats = (state.categories||[]).filter(c=>!c.deleted&&c.type==='expense');
  const incomeCats = (state.categories||[]).filter(c=>!c.deleted&&c.type==='income');
  $('#expenseCategoryList').innerHTML = expenseCats.length ? expenseCats.map(c=>`
    <div class="category-item">
      <div class="cat-icon" style="background:${c.color}"><svg><use href="#${c.icon}"/></svg></div>
      <div class="cat-name">${esc(c.name)}</div>
      <div class="cat-actions">
        <button class="cat-edit" onclick="openCategoryEdit('${c.id}','${c.type}')"><svg><use href="#i-edit"/></svg></button>
        <button class="cat-delete" onclick="deleteCategory('${c.id}')"><svg><use href="#i-trash"/></svg></button>
      </div>
    </div>
  `).join('') : '<div style="text-align:center;color:var(--text3);padding:20px;font-size:13px;">暂无支出分类</div>';
  $('#incomeCategoryList').innerHTML = incomeCats.length ? incomeCats.map(c=>`
    <div class="category-item">
      <div class="cat-icon" style="background:${c.color}"><svg><use href="#${c.icon}"/></svg></div>
      <div class="cat-name">${esc(c.name)}</div>
      <div class="cat-actions">
        <button class="cat-edit" onclick="openCategoryEdit('${c.id}','${c.type}')"><svg><use href="#i-edit"/></svg></button>
        <button class="cat-delete" onclick="deleteCategory('${c.id}')"><svg><use href="#i-trash"/></svg></button>
      </div>
    </div>
  `).join('') : '<div style="text-align:center;color:var(--text3);padding:20px;font-size:13px;">暂无收入分类</div>';
  updateFinanceStats();
}
function openCategoryEdit(id, type){
  const c = id ? state.categories.find(x=>x.id===id) : {name:'', icon:'i-coffee', color:'#F59E0B', type:type||'expense'};
  if(!c) return;
  catEditState = {icon:c.icon, color:c.color};
  openModal(id?'编辑分类':'添加分类', `
    <div class="form-group"><label>分类名称</label><input id="cat_name" value="${esc(c.name)}" placeholder="如：餐饮"></div>
    <div class="form-group"><label>类型</label><select id="cat_type"><option value="expense" ${c.type==='expense'?'selected':''}>支出</option><option value="income" ${c.type==='income'?'selected':''}>收入</option></select></div>
    <div class="form-group"><label>选择图标（${CATEGORY_ICONS.length}个可选）</label><div class="icon-grid" id="cat_icon_grid">${CATEGORY_ICONS.map(ic=>`<button class="icon-opt ${ic===c.icon?'selected':''}" onclick="selectCatIcon('${ic}')"><svg><use href="#${ic}"/></svg></button>`).join('')}</div></div>
    <div class="form-group"><label>选择颜色</label><div class="color-picker">${CATEGORY_COLORS.map(col=>`<div class="color-dot ${col===c.color?'selected':''}" style="background:${col}" onclick="selectCatColor('${col}')"></div>`).join('')}</div></div>
  `, [
    {text:'取消', cls:'btn-secondary', cb:closeModal},
    {text:'保存', cls:'btn-primary', cb:()=>{
      const name = $('#cat_name').value.trim();
      if(!name){ showToast('请输入分类名称'); return; }
      const data = {name, type:$('#cat_type').value, icon:catEditState.icon, color:catEditState.color, updated_at:now()};
      if(id) Object.assign(c, data);
      else state.categories.push({id:uid(), device_id:deviceId, created_at:now(), ...data});
      saveLocal(); closeModal(); renderCategoryManager(); showToast(id?'分类已更新':'分类已添加');
    }}
  ]);
}
function selectCatIcon(icon){
  catEditState.icon = icon;
  $$('#cat_icon_grid .icon-opt').forEach(el => el.classList.toggle('selected', el.querySelector('use').getAttribute('href') === '#'+icon));
}
function selectCatColor(color){
  catEditState.color = color;
  $$('.color-dot').forEach(el => el.classList.toggle('selected', el.style.background === color));
}
function deleteCategory(id){
  showConfirm('删除分类', '确定要删除这个分类吗？', ()=>{
    const c = state.categories.find(x=>x.id===id);
    if(c){ c.deleted = true; c.updated_at = now(); saveLocal(); renderCategoryManager(); showToast('分类已删除'); }
  });
}

// ========== 首页渲染 ==========
function renderDashboard(){
  const now = new Date();
  const hour = now.getHours();
  const greet = hour < 6 ? '夜深了' : hour < 12 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
  $('#greetText').textContent = greet + '，旭哥';
  $('#greetDate').textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + ['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  $('#statTasks').textContent = (state.tasks||[]).filter(t=>!t.deleted&&!t.done).length;
  $('#statTeaching').textContent = (state.classes||[]).filter(c=>!c.deleted).length;
  const todayStr = today();
  const todayExpense = (state.transactions||[]).filter(t=>!t.deleted&&t.type==='expense'&&t.date===todayStr).reduce((a,b)=>a+Number(b.amount||0),0);
  $('#statExpense').textContent = '¥' + todayExpense.toFixed(0);
  // 最近记录
  const recent = [
    ...(state.tasks||[]).filter(t=>!t.deleted).slice(0,3).map(t=>({type:'task', title:t.title, date:t.updated_at, icon:'i-check', color:'#D97706'})),
    ...(state.transactions||[]).filter(t=>!t.deleted).slice(0,3).map(t=>({type:'tx', title:t.note||(t.type==='income'?'收入':'支出'), date:t.updated_at, icon:'i-wallet', color:t.type==='income'?'#059669':'#DC2626'})),
    ...(state.teaching_records||[]).filter(r=>!r.deleted).slice(0,3).map(r=>({type:'teach', title:r.title||'教学记录', date:r.updated_at, icon:'i-book', color:'#2563EB'}))
  ].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  const dashRecent = $('#dashRecent');
  if(recent.length){
    dashRecent.innerHTML = recent.map(r=>`
      <div class="list-item">
        <div class="icon" style="background:${r.color}20;color:${r.color}"><svg><use href="#${r.icon}"/></svg></div>
        <div class="info"><div class="title">${esc(r.title)}</div><div class="desc">${fmtDate(r.date)}</div></div>
      </div>
    `).join('');
  }
}

// ========== 搜索 ==========
function openSearch(){ showToast('搜索功能开发中'); }

// ========== 数据管理 ==========
function exportData(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '旭哥记录_备份_' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}
function clearAllData(){
  showConfirm('清空数据', '确定要清空所有数据吗？此操作不可恢复！', ()=>{
    Object.keys(state).forEach(k => { if(Array.isArray(state[k])) state[k] = []; });
    state.settings = {theme:'default'};
    saveLocal();
    renderDashboard();
    showToast('数据已清空');
  });
}

// ========== 主题 ==========
function setTheme(theme){
  document.body.setAttribute('data-theme', theme);
  state.settings.theme = theme;
  saveLocal();
  $$('#themeGrid .icon-opt').forEach(el => el.classList.toggle('selected', el.querySelector('span').textContent === ({default:'默认',sunny:'暖阳',deepsea:'深海',forest:'森系',sakura:'樱花',night:'暗夜',gold:'黑金',neon:'霓虹',sunset:'落日',mint:'薄荷'})[theme]));
}

// ========== 模态框 ==========
function openModal(title, body, buttons){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  const footer = $('#modalFooter');
  footer.innerHTML = '';
  (buttons||[]).forEach(btn => {
    const b = document.createElement('button');
    b.className = 'btn ' + (btn.cls || 'btn-secondary');
    b.textContent = btn.text;
    b.onclick = btn.cb;
    footer.appendChild(b);
  });
  $('#modalOverlay').classList.add('show');
}
function closeModal(){ $('#modalOverlay').classList.remove('show'); }
function showConfirm(title, msg, onOk){
  openModal(title, `<p style="color:var(--text2);font-size:14px;line-height:1.6;">${esc(msg)}</p>`, [
    {text:'取消', cls:'btn-secondary', cb:closeModal},
    {text:'确定', cls:'btn-primary', cb:()=>{ closeModal(); onOk && onOk(); }}
  ]);
}

// ========== Toast ==========
function showToast(msg){
  const container = $('#toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2500);
}

// ========== 初始化 ==========
function init(){
  loadLocal();
  if(state.settings && state.settings.theme){ setTheme(state.settings.theme); }
  renderDashboard();
  updateSyncDot('idle');
  setTimeout(() => syncAll().catch(()=>{}), 1000);
  setInterval(() => syncAll().catch(()=>{}), 300000);
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW注册失败', e));
  }
  console.log('旭哥记录 v10.0 已启动 | 设备ID:', deviceId);
}

// 页面加载完成后初始化
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
