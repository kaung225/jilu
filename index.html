  const total=pomoState.mode==='focus'?pomoState.focusMin*60:pomoState.breakMin*60;
  const remaining=Math.max(0,pomoState.remaining);
  const pct=((total-remaining)/total)*100;
  const mins=Math.floor(remaining/60);
  const secs=remaining%60;
  const R=120,C=2*Math.PI*R;
  c.innerHTML=`
    <div class="pomo-wrap">
      <div class="pomo-circle">
        <svg width="280" height="280" viewBox="0 0 280 280">
          <circle cx="140" cy="140" r="${R}" fill="none" stroke="var(--card2)" stroke-width="12"/>
          <circle cx="140" cy="140" r="${R}" fill="none" stroke="${isFocus?'var(--accent)':'var(--success)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 140 140)"/>
        </svg>
        <div class="pomo-center">
          <div class="pomo-mode">${isFocus?'专注':'休息'}</div>
          <div class="pomo-time">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div>
          <div class="pomo-round">第 ${pomoState.round} 轮</div>
        </div>
      </div>
      <div class="pomo-controls">
        <button class="btn btn-secondary" onclick="pomoReset()"><svg><use href="#i-reset"/></svg>重置</button>
        <button class="btn btn-primary" style="min-width:120px" onclick="pomoToggle()">${isRunning?'<svg><use href="#i-pause"/></svg>暂停':'<svg><use href="#i-play"/></svg>开始'}</button>
        <button class="btn btn-secondary" onclick="pomoSkip()"><svg><use href="#i-forward"/></svg>跳过</button>
      </div>
      <div class="pomo-settings">
        <div class="form-row"><div class="form-group"><label>专注(分钟)</label><input type="number" id="pomo_focus" value="${pomoState.focusMin}" min="1" max="120" onchange="pomoState.focusMin=Number(this.value);if(!pomoState.running){pomoState.remaining=pomoState.focusMin*60;renderPomodoro();}"></div><div class="form-group"><label>休息(分钟)</label><input type="number" id="pomo_break" value="${pomoState.breakMin}" min="1" max="60" onchange="pomoState.breakMin=Number(this.value);"></div></div>
      </div>
    </div>
    <div class="stats-grid" style="margin-top:16px"><div class="stat-card"><div class="label">今日专注</div><div class="value">${totalFocus}</div><div class="sub">分钟</div></div><div class="stat-card"><div class="label">番茄数</div><div class="value">${todaySessions.filter(s=>s.type==='focus').length}</div><div class="sub">个</div></div><div class="stat-card"><div class="label">休息次数</div><div class="value">${totalBreaks}</div><div class="sub">次</div></div></div>
    <div class="card" style="margin-top:16px"><div class="card-title"><svg><use href="#i-list"/></svg>今日记录</div>${todaySessions.length?todaySessions.slice().reverse().map(s=>`<div class="list-item"><div class="icon" style="background:${s.type==='focus'?'var(--accent-light)':'var(--success)'}"><svg><use href="#${s.type==='focus'?'i-timer':'i-coffee'}"/></svg></div><div class="info"><div class="title">${s.type==='focus'?'专注':'休息'} ${s.duration}分钟</div><div class="desc">${esc(s.start_time||'')}${s.note?' · '+esc(s.note):''}</div></div></div>`).join(''):emptyHTML('i-timer','还没有记录','开始一个番茄钟吧')}</div>`;
}
function pomoToggle(){
  if(pomoState.running){pomoState.running=false;clearInterval(pomoState.timer);}
  else{pomoState.running=true;if(pomoState.remaining<=0)pomoState.remaining=(pomoState.mode==='focus'?pomoState.focusMin:pomoState.breakMin)*60;pomoState.timer=setInterval(()=>{pomoState.remaining--;if(pomoState.remaining<=0){pomoComplete();}else{const el=document.querySelector('.pomo-time');if(el){const m=Math.floor(pomoState.remaining/60),s=pomoState.remaining%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}}},1000);}
  renderPomodoro();
}
function pomoComplete(){
  clearInterval(pomoState.timer);pomoState.running=false;
  const type=pomoState.mode;const duration=type==='focus'?pomoState.focusMin:pomoState.breakMin;
  state.pomodoro_sessions.push({id:uid(),device_id:deviceId,type,duration,date:today(),start_time:new Date().toTimeString().slice(0,5),note:'',created_at:now(),updated_at:now()});

  else{pomoState.mode='focus';pomoState.remaining=pomoState.focusMin*60;showToast('休息结束，继续加油');}
  renderPomodoro();
}
function pomoReset(){clearInterval(pomoState.timer);pomoState.running=false;pomoState.mode='focus';pomoState.round=1;pomoState.remaining=pomoState.focusMin*60;renderPomodoro();}
function pomoSkip(){clearInterval(pomoState.timer);pomoState.running=false;if(pomoState.mode==='focus'){pomoState.mode='break';pomoState.remaining=pomoState.breakMin*60;}else{pomoState.mode='focus';pomoState.round++;pomoState.remaining=pomoState.focusMin*60;}renderPomodoro();}

// --- 全局点击事件委托：确保所有点击都能响应 ---
document.addEventListener('click', function(e){
  // 找到最近的有onclick的元素
  var target = e.target;
  var clicked = false;
  while(target && target !== document){
    if(target.getAttribute && target.getAttribute('onclick')){
      // 已经有onclick，让原生处理
      return;
    }
    if(target.classList && (
      target.classList.contains('stat-card') ||
      target.classList.contains('quick-item') ||
      target.classList.contains('module-entry') ||
      target.classList.contains('section-card') ||
      target.classList.contains('list-item') ||
      target.classList.contains('card') ||
      target.classList.contains('grid-item') ||
      target.classList.contains('timeline-item') ||
      target.classList.contains('idea-card') ||
      target.classList.contains('att-row') ||
      target.classList.contains('category-item') ||
      target.classList.contains('sub-tab') ||
      target.classList.contains('chip') ||
      target.classList.contains('tag') ||
      target.classList.contains('btn') ||
      target.classList.contains('es-cta') ||
      target.classList.contains('section-action') ||
      target.classList.contains('nav-tab') ||
      target.classList.contains('icon-btn') ||
      target.classList.contains('back-btn') ||
      target.classList.contains('theme-opt') ||
      target.classList.contains('color-dot') ||
      target.classList.contains('icon-opt') ||
      target.classList.contains('switch') ||
      target.classList.contains('cat-edit') ||
      target.classList.contains('cat-delete')
    )){
      // 这些元素应该可点击，如果没有onclick，触发一次click确保事件冒泡
      if(!target.getAttribute('onclick')){
        // 检查父元素是否有onclick
        var parent = target.parentElement;
        while(parent && parent !== document){
          if(parent.getAttribute && parent.getAttribute('onclick')){
            return; // 父元素有onclick，让原生处理
          }
          parent = parent.parentElement;
        }
      }
      return;
    }
    target = target.parentElement;
  }
}, true); // 捕获阶段，确保在其他处理之前执行

// --- switchPage：更新导航状态 ---
window.switchPage = function(page){
  // 隐藏所有页面
  var pages = document.querySelectorAll('.page');
  for(var i=0; i<pages.length; i++){
    pages[i].classList.remove('active');
  }
  // 显示目标页面
  var target = document.getElementById('page-' + page);
  if(target) target.classList.add('active');

  try { currentPage = page; } catch(e) {}

  // 更新底部导航
  var navItems = document.querySelectorAll('.bottom-nav .nav-tab');
  for(var j=0; j<navItems.length; j++){
    navItems[j].classList.toggle('active', navItems[j].dataset.page === page);
  }
  // 更新桌面侧边栏
  var sidebarItems = document.querySelectorAll('.desktop-sidebar .sidebar-item');
  for(var k=0; k<sidebarItems.length; k++){
    var item = sidebarItems[k];
    var onclick = item.getAttribute('onclick') || '';
    var match = onclick.indexOf("'"+page+"'") >= 0;
    item.classList.toggle('active', match);
  }
  // 更新顶部标题
  var titles = {dashboard:'旭哥记录', records:'记录中心', finance:'财务中心', tools:'工具中心', settings:'我的'};
  var subs = {dashboard:'今天也要好好记录', records:'教学·生活·学习·项目', finance:'记账·预算·储蓄·债务', tools:'实用工具集合', settings:'个人设置与数据'};
  var ht = document.getElementById('headerTitle');
  var hs = document.getElementById('headerSub');
  if(ht) ht.textContent = titles[page] || '旭哥记录';
  if(hs) hs.textContent = subs[page] || '';

  // 渲染对应页面
  if(page === 'dashboard' && typeof v9_renderDashboard === 'function') v9_renderDashboard();
  if(page === 'records'){
    // 根据currentSub决定显示首页还是子页面
    var sub = null;
    try { sub = typeof currentSub !== 'undefined' ? currentSub.records : null; } catch(e){}
    var rh = document.getElementById('recordsHome');
    var rs = document.getElementById('recordsSub');
    var cm = document.getElementById('categoryManager');
    if(sub && rh && rs){
      rh.style.display = 'none';
      rs.style.display = 'block';
    } else if(rh && rs){
      rh.style.display = 'block';
      rs.style.display = 'none';
    }
    if(cm) cm.style.display = 'none';
    if(typeof renderRecords === 'function') renderRecords();
  }
  if(page === 'finance'){
    // 根据currentSub决定显示首页还是子页面
    var fsub = null;
    try { fsub = typeof currentSub !== 'undefined' ? currentSub.finance : null; } catch(e){}
    var fh = document.getElementById('financeHome');
    var fs = document.getElementById('financeSub');
    var cm2 = document.getElementById('categoryManager');
    if(fsub === 'categories' && cm2){
      if(fh) fh.style.display = 'none';
      if(fs) fs.style.display = 'none';
      cm2.style.display = 'block';
    } else if(fsub && fh && fs){
      fh.style.display = 'none';
      fs.style.display = 'block';
      if(cm2) cm2.style.display = 'none';
    } else if(fh && fs){
      fh.style.display = 'block';
      fs.style.display = 'none';
      if(cm2) cm2.style.display = 'none';
    }
    if(typeof renderFinance === 'function') renderFinance();
    if(typeof renderCategoryManager === 'function') renderCategoryManager();
  }
  if(page === 'tools' && typeof renderToolsPage === 'function') renderToolsPage();
  if(page === 'settings' && typeof renderSettings === 'function') renderSettings();

  // 滚动到顶部
  window.scrollTo(0, 0);
};

// --- 覆盖renderAll：只渲染内容，不重置显示状态 ---
// 原v5的renderAll会调用switchPage(currentPage)，导致子页面显示状态被重置
window.renderAll = function(){
  try {
    var page = typeof currentPage !== 'undefined' ? currentPage : 'dashboard';
    // 只调用对应的渲染函数，不调用switchPage（避免重置显示状态）
    if(page === 'dashboard' && typeof v9_renderDashboard === 'function'){
      v9_renderDashboard();
    }
    if(page === 'records' && typeof renderRecords === 'function'){
      renderRecords();
      // 保持当前子页面显示状态
      setTimeout(function(){
        try {
          var sub = typeof currentSub !== 'undefined' ? currentSub.records : null;
          var rh = document.getElementById('recordsHome');
          var rs = document.getElementById('recordsSub');
          if(sub && rh && rs){
            rh.style.display = 'none';
            rs.style.display = 'block';
          } else if(rh && rs){
            rh.style.display = 'block';
            rs.style.display = 'none';
          }
        } catch(e){}
      }, 10);
    }
    if(page === 'finance' && typeof renderFinance === 'function'){
      renderFinance();
      if(typeof renderCategoryManager === 'function') renderCategoryManager();
      // 保持当前子页面显示状态
      setTimeout(function(){
        try {
          var sub = typeof currentSub !== 'undefined' ? currentSub.finance : null;
          var fh = document.getElementById('financeHome');
          var fs = document.getElementById('financeSub');
          var cm = document.getElementById('categoryManager');
          if(sub === 'categories' && cm){
            if(fh) fh.style.display = 'none';
            if(fs) fs.style.display = 'none';
            cm.style.display = 'block';
          } else if(sub && fh && fs){
            fh.style.display = 'none';
            fs.style.display = 'block';
            if(cm) cm.style.display = 'none';
          } else if(fh && fs){
            fh.style.display = 'block';
            fs.style.display = 'none';
            if(cm) cm.style.display = 'none';
          }
        } catch(e){}
      }, 10);
    }
    if(page === 'tools' && typeof renderToolsPage === 'function') renderToolsPage();
    if(page === 'settings' && typeof renderSettings === 'function') renderSettings();
  } catch(e){
    console.warn('v9 renderAll error:', e);
  }
};

// 渲染分类管理
window.renderCategoryManager = function(){
  if(typeof state === 'undefined') return;
  initCategories();
  if(!state.categories || !state.categories.expense || !state.categories.income) return;

  var renderList = function(cats, type){
    if(!cats || cats.length === 0){
      return '<div class="empty-state"><div class="es-icon"><svg><use href="#i-briefcase"/></svg></div><div class="es-title">暂无分类</div><div class="es-desc">点击右上角添加分类</div></div>';
    }
    return cats.map(function(cat){
      return '<div class="category-item" onclick="openCategoryEdit(\'' + cat.id + '\',\'' + type + '\')">' +
        '<div class="cat-icon" style="background:' + cat.color + '"><svg><use href="#' + cat.icon + '"/></svg></div>' +
        '<div class="cat-name">' + v9_esc(cat.name) + '</div>' +
        '<div class="cat-actions">' +
        '<button class="cat-edit" onclick="event.stopPropagation();openCategoryEdit(\'' + cat.id + '\',\'' + type + '\')" aria-label="编辑"><svg><use href="#i-edit"/></svg></button>' +
        '<button class="cat-delete" onclick="event.stopPropagation();deleteCategory(\'' + cat.id + '\',\'' + type + '\')" aria-label="删除"><svg><use href="#i-close"/></svg></button>' +
        '</div></div>';
    }).join('');
  };

  var expList = document.getElementById('expenseCategoryList');
  var incList = document.getElementById('incomeCategoryList');
  if(expList) expList.innerHTML = renderList(state.categories.expense, 'expense');
  if(incList) incList.innerHTML = renderList(state.categories.income, 'income');

  // 更新分类数量
  var fc = document.getElementById('fcCategories');
  if(fc) fc.textContent = (state.categories.expense.length + state.categories.income.length) + ' 分类';
};

// 分类编辑/添加
window.openCategoryEdit = function(id, type){
  if(typeof state === 'undefined') return;
  initCategories();

  var cat = null;
  if(id){
    cat = state.categories[type].find(function(c){ return c.id === id; });
  }

  var icons = ['i-coffee','i-car','i-briefcase','i-bolt','i-home','i-heart','i-graduation','i-wallet','i-chart','i-calendar','i-clock','i-book','i-rocket','i-exchange','i-download','i-camera','i-credit-card'];
  var colors = ['#F59E0B','#3B82F6','#8B5CF6','#EC4899','#10B981','#EF4444','#06B6D4','#64748B','#F97316','#84CC16'];

  var selectedIcon = cat ? cat.icon : icons[0];
  var selectedColor = cat ? cat.color : colors[0];

  var html = '<div class="form-group">' +
    '<label class="label">分类名称</label>' +
    '<input type="text" id="catNameInput" value="' + (cat ? v9_esc(cat.name) : '') + '" placeholder="请输入分类名称">' +
    '</div>' +
    '<div class="form-group">' +
    '<label class="label">选择图标</label>' +
    '<div class="icon-grid" id="catIconGrid">';
  icons.forEach(function(ic){
    html += '<div class="icon-opt' + (ic === selectedIcon ? ' selected' : '') + '" data-icon="' + ic + '" onclick="selectCatIcon(\'' + ic + '\')"><svg><use href="#' + ic + '"/></svg></div>';
  });
  html += '</div></div>' +
    '<div class="form-group">' +
    '<label class="label">选择颜色</label>' +
    '<div class="color-picker" id="catColorPicker">';
  colors.forEach(function(col){
    html += '<div class="color-dot' + (col === selectedColor ? ' selected' : '') + '" style="background:' + col + '" data-color="' + col + '" onclick="selectCatColor(\'' + col + '\')"></div>';
  });
  html += '</div></div>';

  openModal(cat ? '编辑分类' : '添加分类', html,
    '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" onclick="saveCategory(\'' + (id || '') + '\',\'' + type + '\')">保存</button>'
  );

  // 保存当前选择
  window._catEditState = {icon: selectedIcon, color: selectedColor};
};

window.selectCatIcon = function(icon){
  window._catEditState.icon = icon;
  var items = document.querySelectorAll('#catIconGrid .icon-opt');
  for(var i=0; i<items.length; i++){
    items[i].classList.toggle('selected', items[i].dataset.icon === icon);
  }
};

window.selectCatColor = function(color){
  window._catEditState.color = color;
  var items = document.querySelectorAll('#catColorPicker .color-dot');
  for(var i=0; i<items.length; i++){
    items[i].classList.toggle('selected', items[i].dataset.color === color);
  }
};

window.saveCategory = function(id, type){
  if(typeof state === 'undefined') return;
  initCategories();
  if(!state.categories || !state.categories[type]) return;

  var nameInput = document.getElementById('catNameInput');
  var name = nameInput ? nameInput.value.trim() : '';
  if(!name){
    showToast('请输入分类名称');
    return;
  }
  var icon = window._catEditState ? window._catEditState.icon : 'i-briefcase';
  var color = window._catEditState ? window._catEditState.color : '#64748B';

  if(id){
    var cat = state.categories[type].find(function(c){ return c.id === id; });
    if(cat){
      cat.name = name;
      cat.icon = icon;
      cat.color = color;
    }
  } else {
    state.categories[type].push({
      id: 'c' + Date.now(),
      name: name,
      icon: icon,
      color: color
    });
  }

  if(typeof saveLocal === 'function') saveLocal();
  closeModal();
  renderCategoryManager();
  showToast(id ? '分类已更新' : '分类已添加');
};

window.deleteCategory = function(id, type){
  if(typeof state === 'undefined') return;
  initCategories();
  if(!state.categories || !state.categories[type]) return;

  showConfirm('删除分类', '确定要删除这个分类吗？', function(){
    state.categories[type] = state.categories[type].filter(function(c){ return c.id !== id; });
    if(typeof saveLocal === 'function') saveLocal();
    renderCategoryManager();
    showToast('分类已删除');
  });
};

// --- 首页渲染 ---
function v9_renderDashboard(){
  if(typeof state === 'undefined') return;

  var now = new Date();
  var todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

  // 问候语和日期
  var gt = document.getElementById('greetText');
  if(gt) gt.textContent = v9_greeting();
  var gd = document.getElementById('greetDate');
  if(gd) gd.textContent = v9_formatDate(now);

  // 统计数据
  var pendingTasks = (state.tasks || []).filter(function(t){ return !t.deleted && !t.done; }).length;
  var teachingCount = (state.classes || state.teaching_classes || []).length;
  var todayExpense = (state.transactions || []).filter(function(t){
    return !t.deleted && t.type === 'expense' && t.date === todayStr;
  }).reduce(function(a,b){ return a + Number(b.amount || 0); }, 0);

  // 今日统计卡
  var el;
  el = document.getElementById('statTasks');
  if(el) el.textContent = pendingTasks;
  el = document.getElementById('statTeaching');
  if(el) el.textContent = teachingCount;
  el = document.getElementById('statExpense');
  if(el) el.textContent = '¥' + todayExpense.toFixed(0);

  // 模块统计
  el = document.getElementById('statTeaching2');
  if(el) el.textContent = teachingCount + ' 个班级';
  el = document.getElementById('statLife');
  if(el) el.textContent = pendingTasks + ' 条待办';
  el = document.getElementById('statStudy');
  if(el) el.textContent = (state.subjects || []).length + ' 个科目';
  el = document.getElementById('statProject');
  if(el){
    var activeProjects = (state.plans || state.projects || []).filter(function(p){return !p.deleted && p.status==='active';}).length;
    el.textContent = activeProjects + ' 个进行中';
  }
  el = document.getElementById('statFinance2');
  if(el){
    var monthExpense = (state.transactions || []).filter(function(t){
      return !t.deleted && t.type==='expense' && t.date && t.date.startsWith(todayStr.slice(0,7));
    }).reduce(function(a,b){return a+Number(b.amount||0);},0);
    el.textContent = '本月 ¥' + monthExpense.toFixed(0);
  }

  // 记录中心板块卡片统计
  el = document.getElementById('scTeaching');
  if(el) el.textContent = teachingCount + ' 班级';
  el = document.getElementById('scLife');
  if(el) el.textContent = pendingTasks + ' 待办';
  el = document.getElementById('scStudy');
  if(el) el.textContent = (state.subjects || []).length + ' 科目';
  el = document.getElementById('scProject');
  if(el){
    var activeProj = (state.plans || state.projects || []).filter(function(p){return !p.deleted && p.status==='active';}).length;
    el.textContent = activeProj + ' 进行中';
  }

  // 财务中心板块卡片统计
  el = document.getElementById('fcAccounts');
  if(el) el.textContent = (state.accounts || []).filter(function(a){return !a.deleted;}).length + ' 账户';
  if(typeof initCategories === 'function') initCategories();
  el = document.getElementById('fcCategories');
  if(el && state.categories){
    el.textContent = (state.categories.expense.length + state.categories.income.length) + ' 分类';
  }

  // 最近记录
  var recentEl = document.getElementById('dashRecent');
  if(recentEl){
    var items = [];
    (state.tasks || []).forEach(function(t){
      if(!t.deleted) items.push({type:'task', date:t.due_date || t.created_at, title:t.title, icon:'i-check', color:'#F59E0B'});
    });
    (state.transactions || []).forEach(function(t){
      if(!t.deleted) items.push({type:'finance', date:t.date, title:t.note || (t.type==='income'?'收入':'支出'), icon:'i-wallet', color:t.type==='income'?'#10B981':'#EF4444', amount:t.amount, txType:t.type});
    });
    items.sort(function(a,b){ return (b.date||'') > (a.date||'') ? 1 : -1; });
    items = items.slice(0, 5);

    if(items.length === 0){
      recentEl.innerHTML = '<div class="empty-state">' +
        '<div class="es-icon"><svg><use href="#i-book"/></svg></div>' +
        '<div class="es-title">还没有记录</div>' +
        '<div class="es-desc">从一条待办、教学记录或一笔支出开始</div>' +
        '<button class="es-cta" onclick="openQuickAdd()"><svg><use href="#i-plus"/></svg><span>写下第一条</span></button>' +
        '</div>';
    } else {
      var html = '';
      items.forEach(function(item){
        var amountHtml = item.amount ? '<div class="ri-amount ' + (item.txType==='income'?'income':'expense') + '">' + (item.txType==='income'?'+':'-') + '¥' + Number(item.amount).toFixed(0) + '</div>' : '';
        html += '<div class="recent-item" onclick="v9_openItem(\'' + item.type + '\')">' +
          '<div class="ri-icon" style="background:' + item.color + '"><svg><use href="#' + item.icon + '"/></svg></div>' +
          '<div class="ri-content">' +
          '<div class="ri-title">' + v9_esc(item.title) + '</div>' +
          '<div class="ri-meta">' + (item.date || '') + '</div>' +
          '</div>' +
          amountHtml +
          '</div>';
      });
      recentEl.innerHTML = html;
    }
  }
}

function v9_openItem(type){
  if(type === 'task'){ switchPage('records'); setSub('records','life'); }
  else if(type === 'finance'){ switchPage('finance'); setSub('finance','records'); }
}

      setTimeout(function(){ openAttendanceEdit(); }, 200);
    }
  }, 100);
};

// --- 初始化 ---
try { currentPage = 'dashboard'; } catch(e) {}
var pageDash = document.getElementById('page-dashboard');
if(pageDash) pageDash.classList.add('active');

// 立即渲染首页
try { v9_renderDashboard(); } catch(e){ console.warn('v9 init render error', e); }

// 延迟再次渲染（确保v5 init()完成后覆盖）
setTimeout(function(){
  try { v9_renderDashboard(); } catch(e){}
}, 300);

// 更长延迟再次渲染（确保v5 renderAll()完成后覆盖）
setTimeout(function(){
  try { v9_renderDashboard(); } catch(e){}
}, 1000);

// --- 键盘支持：Escape关闭弹层 ---
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    var mo = document.getElementById('modalOverlay');
    if(mo && mo.classList.contains('show')){ closeModal(); return; }
    var so = document.getElementById('searchOverlay');
    if(so && so.classList.contains('show')){ closeSearch(); return; }
    var co = document.getElementById('confirmOverlay');
    if(co && co.classList.contains('show')){ hideConfirm(false); return; }
  }
});

</script>
