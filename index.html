<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小乐记录</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e67e22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f7f5f0;--card:#fff;--card2:#faf8f5;--text:#2c2620;--text2:#706b64;--text3:#a09a92;
  --accent:#e67e22;--accent2:#f39c12;--accent-light:#fdebd0;--border:#e2ded6;
  --glass:rgba(255,255,255,0.72);--blur:14px;--radius:16px;--radius-sm:10px;
  --shadow:0 2px 12px rgba(44,38,32,0.06);--shadow-lg:0 8px 30px rgba(44,38,32,0.12);
  --nav-h:60px;--safe-b:env(safe-area-inset-bottom,0px);
  --danger:#e74c3c;--success:#27ae60;--info:#3498db;--warning:#f39c12;
  --sidebar-w:220px;
}
[data-theme="sunny"]{--bg:#fff8f0;--card:#fff;--card2:#fff5e6;--text:#3c2a21;--text2:#8a6d5a;--text3:#b8a090;--accent:#e67e22;--accent2:#f39c12;--accent-light:#fdebd0;--border:#f0e0cc;--glass:rgba(255,248,240,0.8)}
[data-theme="deepsea"]{--bg:#0c1929;--card:#132238;--card2:#1a2d47;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#38bdf8;--accent2:#0ea5e9;--accent-light:rgba(56,189,248,0.15);--border:#1e3a5f;--glass:rgba(19,34,56,0.8)}
[data-theme="forest"]{--bg:#f0f7f0;--card:#fff;--card2:#e8f5e9;--text:#1a3620;--text2:#4a6b50;--text3:#7a9b80;--accent:#229954;--accent2:#2ecc71;--accent-light:#d5f5e3;--border:#c8e6c9;--glass:rgba(255,255,255,0.8)}
[data-theme="sakura"]{--bg:#fff5f7;--card:#fff;--card2:#fff0f3;--text:#4a2030;--text2:#8a5a6a;--text3:#b88a9a;--accent:#e91e63;--accent2:#f06292;--accent-light:#fce4ec;--border:#f8c8d4;--glass:rgba(255,245,247,0.8)}
[data-theme="night"]{--bg:#0f0f0f;--card:#1a1a1a;--card2:#252525;--text:#f0f0f0;--text2:#a0a0a0;--text3:#606060;--accent:#bb86fc;--accent2:#985eff;--accent-light:rgba(187,134,252,0.15);--border:#333;--glass:rgba(26,26,26,0.85)}
[data-theme="gold"]{--bg:#1a1408;--card:#2a2010;--card2:#352a18;--text:#f5e6c8;--text2:#c4a86a;--text3:#8a7040;--accent:#ffd700;--accent2:#ffaa00;--accent-light:rgba(255,215,0,0.12);--border:#4a3a20;--glass:rgba(42,32,16,0.85)}
[data-theme="minimal"]{--bg:#ffffff;--card:#ffffff;--card2:#f5f5f5;--text:#1a1a1a;--text2:#666;--text3:#aaa;--accent:#1a1a1a;--accent2:#444;--accent-light:#f0f0f0;--border:#e5e5e5;--glass:rgba(255,255,255,0.9)}
[data-theme="neon"]{--bg:#0a0a1a;--card:#12122a;--card2:#1a1a3a;--text:#e0e0ff;--text2:#8888bb;--text3:#555588;--accent:#00ffff;--accent2:#ff00ff;--accent-light:rgba(0,255,255,0.1);--border:#2a2a5a;--glass:rgba(18,18,42,0.85)}
[data-theme="sunset"]{--bg:#fff3ed;--card:#fff;--card2:#fff0e8;--text:#3d1a0a;--text2:#8a5a40;--text3:#b88a70;--accent:#ff5722;--accent2:#ff8a65;--accent-light:#fbe9e7;--border:#f8ccc0;--glass:rgba(255,243,237,0.8)}
[data-theme="mint"]{--bg:#f0faf7;--card:#fff;--card2:#e8f8f2;--text:#0d3322;--text2:#3a7a5a;--text3:#6aaa8a;--accent:#00bfa5;--accent2:#4db6ac;--accent-light:#e0f2f1;--border:#c8e6dc;--glass:rgba(255,250,247,0.8)}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
[data-bg="paper"] body::before{background-image:radial-gradient(circle at 20% 30%,rgba(0,0,0,.02) 0,transparent 50%),radial-gradient(circle at 80% 70%,rgba(0,0,0,.02) 0,transparent 50%)}
[data-bg="dots"] body::before{background-image:radial-gradient(var(--text3) 1.5px,transparent 1.5px);background-size:24px 24px;opacity:.3}
[data-bg="grid"] body::before{background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:32px 32px;opacity:.4}
[data-bg="warm"] body::before{background:linear-gradient(135deg,rgba(230,126,34,.06),rgba(243,156,18,.04))}
[data-bg="cool"] body::before{background:linear-gradient(135deg,rgba(52,152,219,.06),rgba(41,128,185,.04))}
[data-bg="diagonal"] body::before{background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(0,0,0,.015) 20px,rgba(0,0,0,.015) 21px)}
[data-bg="waves"] body::before{background:radial-gradient(ellipse at 50% 0%,rgba(230,126,34,.05),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(52,152,219,.05),transparent 60%)}
[data-bg="solid"] body::before{background:none}

#app{position:relative;z-index:1;display:flex;min-height:100vh}

/* 侧边栏（桌面端） */
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);padding:20px 12px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;display:none;flex-direction:column}
.sidebar .logo{display:flex;align-items:center;gap:10px;padding:8px 12px 20px;font-size:18px;font-weight:700;color:var(--accent)}
.sidebar .logo svg{width:28px;height:28px}
.sidebar .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:14px;transition:all .2s;margin-bottom:2px}
.sidebar .nav-item:hover{background:var(--card2);color:var(--text)}
.sidebar .nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.sidebar .nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar .nav-section{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:16px 14px 6px;font-weight:600}
.sidebar .spacer{flex:1}
.sidebar .sync-status{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;color:var(--text2);border-top:1px solid var(--border)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-dot.ok{background:var(--success)}
.sync-dot.syncing{background:var(--warning);animation:pulse 1s infinite}
.sync-dot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 主内容区 */
.main{flex:1;margin-left:0;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 10px);min-height:100vh}
@media(min-width:900px){.sidebar{display:flex}.main{margin-left:var(--sidebar-w);padding-bottom:20px}}

/* 顶部栏 */
.topbar{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:18px;font-weight:700;flex:1;display:flex;align-items:center;gap:8px}
.topbar h1 svg{width:22px;height:22px;color:var(--accent)}
.topbar .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--card2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.topbar .icon-btn:hover{background:var(--accent-light);color:var(--accent)}
.topbar .icon-btn svg{width:18px;height:18px}

/* 页面 */
.page{display:none;padding:16px;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title svg{width:16px;height:16px;color:var(--accent)}

/* 统计卡片 */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-card .label{font-size:12px;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:22px;font-weight:700;color:var(--text)}
.stat-card .sub{font-size:11px;color:var(--text3);margin-top:2px}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,1fr)}}

/* 列表项 */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--card2)}
.list-item .icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.list-item .icon svg{width:20px;height:20px}
.list-item .info{flex:1;min-width:0}
.list-item .info .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .info .desc{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .right{text-align:right;flex-shrink:0}
.list-item .right .amount{font-size:15px;font-weight:700}
.list-item .right .date{font-size:11px;color:var(--text3);margin-top:2px}

/* 空状态 */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px}
.empty .hint{font-size:12px;margin-top:4px;color:var(--text3)}

/* 底部导航（移动端） */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-top:1px solid var(--border);display:flex;z-index:99}
.bottom-nav .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;transition:color .2s;padding:6px 0}
.bottom-nav .nav-tab svg{width:22px;height:22px}
.bottom-nav .nav-tab.active{color:var(--accent)}
@media(min-width:900px){.bottom-nav{display:none}}

/* FAB */
.fab{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);right:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;box-shadow:var(--shadow-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:98;transition:transform .2s}
.fab:hover{transform:scale(1.08)}
.fab svg{width:24px;height:24px}
@media(min-width:900px){.fab{bottom:24px;right:24px}}

/* 模态框 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;max-height:90vh;border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:600px){.modal{border-radius:20px;margin:auto;max-height:85vh}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-header h3{flex:1;font-size:16px;font-weight:700}
.modal-header .close-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--card2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px}

/* 表单 */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--card2);color:var(--text);outline:none;transition:border-color .2s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 按钮 */
.btn{padding:11px 20px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--card2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:7px 14px;font-size:12px}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag-success{background:rgba(39,174,96,.12);color:var(--success)}
.tag-danger{background:rgba(231,76,60,.12);color:var(--danger)}
.tag-warning{background:rgba(243,156,18,.12);color:var(--warning)}
.tag-info{background:rgba(52,152,219,.12);color:var(--info)}

/* 进度条 */
.progress-bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease}

/* 分段选择 */
.segment{display:flex;background:var(--card2);border-radius:var(--radius-sm);padding:3px;gap:2px}
.segment button{flex:1;padding:8px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .2s;font-family:inherit}
.segment button.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

/* 图标选择网格 */
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:160px;overflow-y:auto}
.icon-grid .icon-opt{width:100%;aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-grid .icon-opt:hover{border-color:var(--accent)}
.icon-grid .icon-opt.selected{background:var(--accent-light);border-color:var(--accent)}
.icon-grid .icon-opt svg{width:18px;height:18px}

/* 颜色选择 */
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-dot.selected{border-color:var(--text);transform:scale(1.15)}

/* Toast */
.toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .3s ease;display:flex;align-items:center;gap:8px;max-width:90vw}
.toast .undo{color:var(--accent2);cursor:pointer;font-weight:700;margin-left:8px}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

/* 搜索覆盖层 */
.search-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column}
.search-overlay.open{display:flex}
.search-header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.search-header input{flex:1;padding:10px 16px;border:1px solid var(--border);border-radius:20px;font-size:14px;background:var(--card);color:var(--text);outline:none}
.search-results{flex:1;overflow-y:auto;padding:16px}

/* 子页面tab */
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit}
.sub-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 数字键盘 */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.keypad button{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);color:var(--text);font-size:18px;font-weight:600;cursor:pointer;transition:all .1s;font-family:inherit}
.keypad button:active{background:var(--accent-light);transform:scale(.96)}
.keypad button.op{background:var(--accent-light);color:var(--accent)}

/* 金额显示 */
.amount-display{text-align:center;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
.amount-display .currency{font-size:16px;color:var(--text2);margin-right:4px}
.amount-display .number{font-size:36px;font-weight:700;color:var(--text)}

/* 图表容器 */
.chart-container{position:relative;width:100%;height:180px}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-wrap .legend{flex:1;font-size:12px}
.donut-wrap .legend-item{display:flex;align-items:center;gap:6px;padding:3px 0}
.donut-wrap .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* 时间线 */
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:14px}
.timeline-item::before{content:'';position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.timeline-item .tl-date{font-size:11px;color:var(--text3)}
.timeline-item .tl-title{font-size:13px;font-weight:600;margin:2px 0}
.timeline-item .tl-desc{font-size:12px;color:var(--text2)}

/* 切换开关 */
.switch{position:relative;width:44px;height:24px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:var(--border);border-radius:12px;transition:.3s;cursor:pointer}
.switch .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider::before{transform:translateX(20px)}

/* 设置项 */
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.setting-item:last-child{border-bottom:none}
.setting-item .si-info{flex:1}
.setting-item .si-title{font-size:14px;font-weight:600}
.setting-item .si-desc{font-size:12px;color:var(--text2);margin-top:2px}

/* 日历 */
.calendar{margin-bottom:14px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-header button{width:30px;height:30px;border-radius:50%;border:none;background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.cal-header span{font-size:14px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .cal-dow{font-size:10px;color:var(--text3);padding:4px 0}
.cal-grid .cal-day{padding:6px 0;font-size:12px;border-radius:8px;cursor:pointer;position:relative;transition:background .15s}
.cal-grid .cal-day:hover{background:var(--card2)}
.cal-grid .cal-day.today{background:var(--accent);color:#fff;font-weight:700}
.cal-grid .cal-day.selected{background:var(--accent-light);color:var(--accent);font-weight:700}
.cal-grid .cal-day.other{color:var(--text3);opacity:.4}
.cal-grid .cal-day .dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-grid .cal-day.today .dot{background:#fff}

/* 提醒横幅 */
.reminder-banner{background:var(--accent-light);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.reminder-banner svg{width:20px;height:20px;color:var(--accent);flex-shrink:0}
.reminder-banner .rb-text{flex:1;font-size:13px;font-weight:600}
.reminder-banner .rb-time{font-size:11px;color:var(--text2)}

/* 加载骨架 */
.skeleton{background:linear-gradient(90deg,var(--card2) 25%,var(--border) 50%,var(--card2) 75%);background-size:200% 100%;animation:skeleton 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* 滚动条 */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* 工具提示 */
.hint-text{font-size:11px;color:var(--text3);margin-top:4px}

/* 横向滚动容器 */
.h-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.h-scroll::-webkit-scrollbar{display:none}
.h-scroll .chip{padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .2s}
.h-scroll .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 两列布局 */
.two-col{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.two-col{grid-template-columns:1fr 1fr}}
</style>

// Supabase 请求
async function sbReq(table, method, data, params){
  const url = new URL(SB_URL+'/'+table);
  if(params) Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const headers = { 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json', 'Prefer':'return=representation' };
  try{
    const res = await fetch(url, { method, headers, body:data?JSON.stringify(data):undefined });
    if(!res.ok) return { error:res.status+' '+res.statusText };
    return method==='DELETE'?{ok:true}:await res.json();
  }catch(e){ return { error:e.message }; }
}

// 同步引擎（增量合并，按 updated_at）
async function syncAll(){
  if(syncStatus==='syncing') return;
  setSyncStatus('syncing');
  let hasError = false;
  for(const table of TABLES){
    // 拉取云端数据
    const remote = await sbReq(table, 'GET', null, { 'device_id':'eq.'+deviceId, 'select':'*', 'order':'updated_at.desc' });
    if(remote.error){ hasError=true; continue; }
    // 合并：按 id 去重，取 updated_at 较新的
    const localMap = {};
    state[table].forEach(r=>{ localMap[r.id]=r; });
    remote.forEach(r=>{
      const local = localMap[r.id];
      if(!local || new Date(r.updated_at)>new Date(local.updated_at)){
        state[table] = state[table].filter(x=>x.id!==r.id);
        if(!r.deleted) state[table].push(r);
      }
    });
    // 推送本地新增/修改（updated_at 在最近5分钟内的）
    const fiveMinAgo = new Date(Date.now()-300000).toISOString();
    const toPush = state[table].filter(r=>r.device_id===deviceId && new Date(r.updated_at)>new Date(fiveMinAgo));
    for(const rec of toPush){
      const exists = remote.find(r=>r.id===rec.id);
      if(exists){ await sbReq(table, 'PATCH', rec, { 'id':'eq.'+rec.id }); }
      else{ await sbReq(table, 'POST', rec); }
    }
  }
  saveLocal();
  setSyncStatus(hasError?'error':'ok');
  renderAll();
}

function setSyncStatus(s){
  syncStatus=s;
  const dot=$('#syncDot'), txt=$('#syncText');
  if(!dot) return;
  dot.className='sync-dot '+ (s==='ok'?'ok':s==='syncing'?'syncing':s==='error'?'err':'');
  txt.textContent = s==='ok'?'已同步':s==='syncing'?'同步中...':s==='error'?'同步失败':'未同步';
}

function doSearch(q){
  if(!q.trim()){ $('#searchResults').innerHTML=''; return; }
  const results=[];
  const ql=q.toLowerCase();
  state.tasks.filter(t=>!t.deleted&&(t.title.toLowerCase().includes(ql)||t.note.toLowerCase().includes(ql))).forEach(t=>results.push({type:'待办',title:t.title,desc:t.note,date:t.due_date}));
  state.teaching_records.filter(t=>!t.deleted&&(t.title.toLowerCase().includes(ql)||t.content.toLowerCase().includes(ql))).forEach(t=>results.push({type:'教学',title:t.title||'教学记录',desc:t.content,date:t.date}));
  state.life_records.filter(t=>!t.deleted&&(t.title.toLowerCase().includes(ql)||t.content.toLowerCase().includes(ql))).forEach(t=>results.push({type:'生活',title:t.title,desc:t.content,date:t.date}));
  state.study_records.filter(t=>!t.deleted&&t.content.toLowerCase().includes(ql)).forEach(t=>{const s=state.subjects.find(x=>x.id===t.subject_id);results.push({type:'学习',title:(s?s.name:'学习')+' - '+t.content.slice(0,30),desc:t.note,date:t.date});});
  state.transactions.filter(t=>!t.deleted&&t.note.toLowerCase().includes(ql)).forEach(t=>results.push({type:'财务',title:fmtMoney(t.amount,t.currency)+(t.note?' - '+t.note:''),desc:t.type==='income'?'收入':'支出',date:t.date}));
  $('#searchResults').innerHTML = results.length?results.map(r=>`

}

function renderTasks(){
  let list=state.tasks.filter(t=>!t.deleted);
  if(taskFilter==='today') list=list.filter(t=>!t.done&&t.due_date===today());
  else if(taskFilter==='pending') list=list.filter(t=>!t.done);
  else if(taskFilter==='done') list=list.filter(t=>t.done);
  list=list.sort((a,b)=>{ if(a.done!==b.done) return a.done?1:-1; return new Date(b.updated_at)-new Date(a.updated_at); });

  $('#taskFilter').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.f===taskFilter));
  $('#taskList').innerHTML = list.length?list.map(t=>`
    <div class="list-item">
      <div class="icon" style="background:${t.done?'var(--success)':'var(--card2)'};color:${t.done?'#fff':'var(--text3)'};cursor:pointer" onclick="toggleTask('${t.id}')"><svg><use href="#i-check"/></svg></div>
      <div class="info" onclick="openTaskEdit('${t.id}')">
        <div class="title" style="${t.done?'text-decoration:line-through;color:var(--text3)':''}">${esc(t.title)}</div>
        <div class="desc">${esc(t.category)}${t.due_date?' · '+esc(fmtDate(t.due_date)):''}${t.remind_at?' · 🔔':''}</div>
      </div>
      <div class="right"><button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();deleteTask('${t.id}')"><svg><use href="#i-trash"/></svg></button></div>
    </div>`).join(''):emptyHTML('i-check','暂无待办','点击右下角 + 添加任务');
}
$('#taskFilter').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{taskFilter=b.dataset.f;renderTasks();}));

function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.done=!t.done;
  t.done_at=t.done?now():null;
  t.updated_at=now();
  saveLocal();
  renderAll();
  if(t.done) showToast('已完成');
}
function deleteTask(id){
  showConfirm('删除任务','确定要删除这个待办吗？').then(ok=>{
    if(!ok) return;
    const t=state.tasks.find(x=>x.id===id);
    if(t){ t.deleted=true; t.updated_at=now(); saveLocal(); renderAll(); showToast('已删除'); }
  });
}
function openTaskEdit(id){
  const t=id?state.tasks.find(x=>x.id===id):{title:'',note:'',category:'默认',due_date:'',remind_at:'',priority:0};
  if(!t) return;
  openModal(id?'编辑任务':'新建任务',`
    <div class="form-group"><label>任务标题</label><input id="te_title" value="${esc(t.title)}" placeholder="要做什么？"></div>
    <div class="form-row">
      <div class="form-group"><label>分类</label><input id="te_category" value="${esc(t.category)}" placeholder="如：工作/生活"></div>
      <div class="form-group"><label>优先级</label><select id="te_priority"><option value="0" ${t.priority==0?'selected':''}>普通</option><option value="1" ${t.priority==1?'selected':''}>重要</option><option value="2" ${t.priority==2?'selected':''}>紧急</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>截止日期</label><input type="date" id="te_due" value="${esc(fmtDate(t.due_date))}"></div>
      <div class="form-group"><label>提醒时间</label><input type="datetime-local" id="te_remind" value="${t.remind_at?t.remind_at.slice(0,16):''}"></div>
    </div>
    <div class="form-group"><label>备注</label><textarea id="te_note" placeholder="详细说明...">${esc(t.note)}</textarea></div>
  `,'',[
    {text:'取消',cls:'btn-secondary',cb:closeModal},
    {text:'保存',cls:'btn-primary',cb:()=>{
      const title=$('#te_title').value.trim();
      if(!title){ showToast('请输入标题'); return; }
      const data={ title, note:$('#te_note').value, category:$('#te_category').value||'默认', due_date:$('#te_due').value||null, remind_at:$('#te_remind').value?$('#te_remind').value+':00':null, reminded:false, priority:Number($('#te_priority').value), updated_at:now() };

      saveLocal(); closeModal(); renderAll(); showToast(id?'已更新':'已添加');

  ]);

function renderTeaching(){

    if(!classes.length){ c.innerHTML=emptyHTML('i-users','还没有班级','先去班级管理添加一个班级'); return; }
    const selClass=classes[0];
    const students=state.students.filter(s=>!s.deleted&&s.class_id===selClass.id);
    const month=today().slice(0,7);
    c.innerHTML=`
      <div class="card">
        <div class="card-title"><svg><use href="#i-users"/></svg>考勤 - ${esc(selClass.name)}</div>
        <div class="h-scroll" style="margin-bottom:12px">${classes.map(cl=>`<div class="chip ${cl.id===selClass.id?'active':''}" onclick="state._selClass='${cl.id}';renderTeaching()">${esc(cl.name)}</div>`).join('')}</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:8px">${month} 月度统计</div>
        ${students.length?students.map(s=>{
          const att=state.attendance.filter(a=>!a.deleted&&a.student_id===s.id&&String(a.date).startsWith(month));
          const absent=att.filter(a=>a.status==='absent').length;
          const late=att.filter(a=>a.status==='late').length;

          return `<div class="list-item" onclick="showStudentAttDetail('${s.id}','${esc(s.name)}')">

  } else if(sub==='records'){
    const recs=state.teaching_records.filter(r=>!r.deleted).sort((a,b)=>new Date(b.date)-new Date(a.date));
    c.innerHTML=recs.length?`<div class="card">${recs.map(r=>{
      const cl=state.classes.find(c=>c.id===r.class_id);
      return `<div class="list-item" onclick="openTeachingRecordEdit('${r.id}')">
        <div class="icon" style="background:var(--info)"><svg><use href="#i-book"/></svg></div>
        <div class="info"><div class="title">${esc(r.title||'教学记录')}</div><div class="desc">${esc(cl?cl.name:'')} · ${esc(fmtDate(r.date))} · ${esc(r.content.slice(0,40))}</div></div>
      </div>`;
    }).join('')}</div>`:emptyHTML('i-book','暂无教学记录','点击右下角 + 添加');
    if(recs.length) c.innerHTML+=`<button class="btn btn-primary btn-block" onclick="openTeachingRecordEdit()"><svg><use href="#i-plus"/></svg>添加教学记录</button>`;
  } else {
    const classes=state.classes.filter(c=>!c.deleted);
    c.innerHTML=classes.length?classes.map(cl=>{
      const sc=state.students.filter(s=>!s.deleted&&s.class_id===cl.id).length;

    c.innerHTML+=`<button class="btn btn-primary btn-block" onclick="openClassEdit()"><svg><use href="#i-plus"/></svg>添加班级</button>`;
  }
}

      const data={ name, subject:$('#ce_subject').value, grade:$('#ce_grade').value, note:'', updated_at:now() };
      let classId=id;

      // 更新学生
      const names=$('#ce_students').value.split('\n').map(n=>n.trim()).filter(Boolean);
      const existing=state.students.filter(s=>s.class_id===classId);
      names.forEach((name,i)=>{

  ]);

let finState = { currentBook:null, addType:'expense', addAmount:'0', addCat:null, addAccount:null, addDate:today(), addNote:'', addToAccount:null };

function getDefaultBook(){
  if(!finState.currentBook){
    const b=state.books.find(b=>!b.deleted&&b.is_default)||state.books.find(b=>!b.deleted);
    if(b) finState.currentBook=b.id;
  }
  return finState.currentBook;
}
function ensureBook(){
  if(state.books.filter(b=>!b.deleted).length===0){
    const id=uid();
    state.books.push({ id, device_id:deviceId, name:'日常账本', currency:'MMK', icon:'i-wallet', color:'#e67e22', is_default:true, created_at:now(), updated_at:now() });
    // 默认账户
    state.accounts.push({ id:uid(), device_id:deviceId, book_id:id, name:'现金', type:'cash', balance:0, currency:'MMK', icon:'i-wallet', color:'#27ae60', sort_order:0, created_at:now(), updated_at:now() });
    state.accounts.push({ id:uid(), device_id:deviceId, book_id:id, name:'银行卡', type:'bank', balance:0, currency:'MMK', icon:'i-credit-card', color:'#3498db', sort_order:1, created_at:now(), updated_at:now() });
    // 默认分类
    const expCats=[['餐饮','i-utensils','#e74c3c'],['交通','i-car','#3498db'],['购物','i-shopping','#9b59b6'],['娱乐','i-game','#f39c12'],['居住','i-home','#1abc9c'],['医疗','i-medical','#e74c3c'],['教育','i-graduation','#3498db'],['其他','i-star','#95a5a6']];
    const incCats=[['工资','i-briefcase','#27ae60'],['奖金','i-gift','#f39c12'],['投资','i-chart','#3498db'],['兼职','i-briefcase','#9b59b6'],['其他','i-star','#95a5a6']];
    expCats.forEach((c,i)=>state.categories.push({ id:uid(), device_id:deviceId, book_id:id, type:'expense', name:c[0], icon:c[1], color:c[2], sort_order:i, is_default:true, created_at:now(), updated_at:now() }));
    incCats.forEach((c,i)=>state.categories.push({ id:uid(), device_id:deviceId, book_id:id, type:'income', name:c[0], icon:c[1], color:c[2], sort_order:i, is_default:true, created_at:now(), updated_at:now() }));
    finState.currentBook=id;
    saveLocal();
  }
}

function renderFinance(){
  ensureBook();
  const bookId=getDefaultBook();
  const book=state.books.find(b=>b.id===bookId);
  const sub=currentSub.finance;
  const c=$('#financeContent');

  // 账本切换
  const books=state.books.filter(b=>!b.deleted);
  const bookSwitch=`<div class="h-scroll" style="margin-bottom:12px">${books.map(b=>`<div class="chip ${b.id===bookId?'active':''}" onclick="finState.currentBook='${b.id}';renderFinance()">${esc(b.name)}</div>`).join('')}<div class="chip" onclick="openBookEdit()">+ 新账本</div></div>`;

  if(sub==='overview'){
    const month=today().slice(0,7);
    const tx=state.transactions.filter(t=>!t.deleted&&t.book_id===bookId&&String(t.date).startsWith(month));
    const income=tx.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount||0),0);
    const expense=tx.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount||0),0);
    const accounts=state.accounts.filter(a=>!a.deleted&&a.book_id===bookId);
    const totalAssets=accounts.reduce((a,b)=>a+Number(b.balance||0),0);
    const savings=state.savings.filter(s=>!s.deleted&&s.book_id===bookId);
    const totalSaving=savings.reduce((a,b)=>a+Number(b.current_amount||0),0);
    const debts=state.debts.filter(d=>!d.deleted&&d.book_id===bookId);
    const totalDebt=debts.reduce((a,b)=>a+Number(b.remaining||0),0);

    // 分类支出饼图数据
    const catExp={};
    tx.filter(t=>t.type==='expense').forEach(t=>{
      const cat=state.categories.find(c=>c.id===t.category_id);
      const name=cat?cat.name:'其他';
      catExp[name]=(catExp[name]||0)+Number(t.amount||0);
    });
    const catEntries=Object.entries(catExp).sort((a,b)=>b[1]-a[1]);
    const donutColors=['#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22','#27ae60','#95a5a6'];

    c.innerHTML=bookSwitch+`
      <div class="stats-grid">
        <div class="stat-card"><div class="label">总资产</div><div class="value" style="font-size:18px">${fmtMoney(totalAssets,book?.currency)}</div></div>
        <div class="stat-card"><div class="label">本月收入</div><div class="value" style="color:var(--success);font-size:18px">${fmtMoney(income,book?.currency)}</div></div>
        <div class="stat-card"><div class="label">本月支出</div><div class="value" style="color:var(--danger);font-size:18px">${fmtMoney(expense,book?.currency)}</div></div>
        <div class="stat-card"><div class="label">结余</div><div class="value" style="font-size:18px;color:${income-expense>=0?'var(--success)':'var(--danger)'}">${fmtMoney(income-expense,book?.currency)}</div></div>
      </div>
      <div class="card">
        <div class="card-title"><svg><use href="#i-chart"/></svg>本月支出分类</div>
        ${catEntries.length?`
          <div class="donut-wrap">
            <svg width="120" height="120" viewBox="0 0 120 120">
              ${(()=>{ let offset=0; const total=catEntries.reduce((a,b)=>a+b[1],0); return catEntries.slice(0,8).map((e,i)=>{ const pct=e[1]/total; const dash=pct*251.2; const html=`<circle cx="60" cy="60" r="40" fill="none" stroke="${donutColors[i%donutColors.length]}" stroke-width="16" stroke-dasharray="${dash} ${251.2-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"/>`; offset+=dash; return html; }).join(''); })()}
              <text x="60" y="56" text-anchor="middle" font-size="11" fill="var(--text2)">支出</text>
              <text x="60" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)">${fmtMoney(expense,book?.currency)}</text>
            </svg>
            <div class="legend">${catEntries.slice(0,6).map((e,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${donutColors[i%donutColors.length]}"></div>${esc(e[0])} <span style="margin-left:auto;color:var(--text3)">${Math.round(e[1]/expense*100)}%</span></div>`).join('')}</div>
          </div>`:emptyHTML('i-chart','本月暂无支出','去记一笔吧')}
      </div>
      <div class="two-col">
        <div class="card"><div class="card-title"><svg><use href="#i-piggy"/></svg>储蓄目标</div>
          ${savings.length?savings.slice(0,2).map(s=>{
            const pct=s.target_amount?Math.min(100,Math.round(s.current_amount/s.target_amount*100)):0;
            return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(s.name)}</span><span style="color:var(--text2)">${pct}%</span></div><div class="progress-bar"><div class="fill" style="width:${pct}%;background:${s.color}"></div></div><div style="font-size:11px;color:var(--text3);margin-top:2px">${fmtMoney(s.current_amount,book?.currency)} / ${fmtMoney(s.target_amount,book?.currency)}</div></div>`;
          }).join(''):emptyHTML('i-piggy','暂无储蓄计划','')}

        </div>
        <div class="form-group"><label>兑换为</label><select id="fx_to" onchange="doFX()">${CURRENCIES.map(c=>`<option value="${c.code}" ${c.code==='CNY'?'selected':''}>${c.name}(${c.symbol})</option>`).join('')}</select></div>

          <div class="form-group"><label>贷款金额</label><input type="number" id="loan_amount" value="100000" oninput="calcLoan()"></div>

        </div>

        <div id="loan_result" style="padding:12px;background:var(--card2);border-radius:12px;font-size:13px"></div>

function doFX(){
  const amt=Number($('#fx_amount')?.value||0);
  const from=CURRENCIES.find(c=>c.code===$('#fx_from')?.value);
  const to=CURRENCIES.find(c=>c.code===$('#fx_to')?.value);
  if(!from||!to||!$('#fx_result')) return;
  const cny=amt*from.rate;
  const result=cny/to.rate;
  $('#fx_result').textContent=`${from.symbol}${amt.toLocaleString()} = ${to.symbol}${result.toLocaleString(undefined,{minimumFractionDigits:to.decimals,maximumFractionDigits:to.decimals})}`;
}
function calcLoan(){
  const P=Number($('#loan_amount')?.value||0);
  const annual=Number($('#loan_rate')?.value||0)/100;
  const n=Number($('#loan_months')?.value||1);
  if(!$('#loan_result')||!P||!n) return;
  const r=annual/12;
  let monthly, total;
  if(r===0){ monthly=P/n; total=P; }
  else { monthly=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1); total=monthly*n; }
  const interest=total-P;
  $('#loan_result').innerHTML=`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>月供</span><span style="font-weight:700">¥${monthly.toFixed(2)}</span></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>总还款</span><span style="font-weight:700">¥${total.toFixed(2)}</span></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>总利息</span><span style="font-weight:700;color:var(--danger)">¥${interest.toFixed(2)}</span></div>`;
}

// 记账（数字键盘）
function openTransactionEdit(id){
  const bookId=getDefaultBook();
  const book=state.books.find(b=>b.id===bookId);
  const t=id?state.transactions.find(x=>x.id===id):null;
  finState.addType=t?t.type:'expense';
  finState.addAmount=t?String(t.amount):'0';
  finState.addCat=t?t.category_id:null;
  finState.addAccount=t?t.account_id:null;
  finState.addToAccount=t?t.to_account_id:null;
  finState.addDate=t?fmtDate(t.date):today();
  finState.addNote=t?t.note:'';

  const accounts=state.accounts.filter(a=>!a.deleted&&a.book_id===bookId);
  if(!finState.addAccount&&accounts.length) finState.addAccount=accounts[0].id;

  function renderModal(){
    const cats=state.categories.filter(c=>!c.deleted&&c.book_id===bookId&&c.type===finState.addType);
    if(!finState.addCat&&cats.length) finState.addCat=cats[0].id;
    openModal(id?'编辑记录':'记一笔',`
      <div class="segment" style="margin-bottom:14px">
        <button class="${finState.addType==='expense'?'active':''}" onclick="finState.addType='expense';finState.addCat=null;renderModal()">支出</button>
        <button class="${finState.addType==='income'?'active':''}" onclick="finState.addType='income';finState.addCat=null;renderModal()">收入</button>
        <button class="${finState.addType==='transfer'?'active':''}" onclick="finState.addType='transfer';finState.addCat=null;renderModal()">转账</button>
      </div>
      <div class="amount-display"><span class="currency">${book?.currency==='MMK'?'K':book?.currency==='CNY'?'¥':'$'}</span><span class="number">${Number(finState.addAmount).toLocaleString()}</span></div>
      ${finState.addType!=='transfer'?`
      <div style="margin-bottom:12px"><div style="font-size:12px;color:var(--text2);margin-bottom:6px">选择分类</div>
      <div class="h-scroll">${cats.map(c=>`<div class="chip" style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;${finState.addCat===c.id?`background:${c.color};color:#fff;border-color:${c.color}`:''}" onclick="finState.addCat='${c.id}';document.querySelectorAll('#modalBody .chip').forEach(x=>x.style.background='');this.style.background='${c.color}';this.style.color='#fff'"><svg style="width:18px;height:18px"><use href="#${c.icon}"/></svg><span style="font-size:10px">${esc(c.name)}</span></div>`).join('')}</div></div>`:''}
      <div class="form-row">
        <div class="form-group"><label>${finState.addType==='transfer'?'转出账户':'账户'}</label><select id="te_account">${accounts.map(a=>`<option value="${a.id}" ${finState.addAccount===a.id?'selected':''}>${esc(a.name)} (${fmtMoney(a.balance,a.currency)})</option>`).join('')}</select></div>
        ${finState.addType==='transfer'?`<div class="form-group"><label>转入账户</label><select id="te_toaccount">${accounts.filter(a=>a.id!==finState.addAccount).map(a=>`<option value="${a.id}" ${finState.addToAccount===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`:''}
      </div>
      <div class="form-row">
        <div class="form-group"><label>日期</label><input type="date" id="te_date" value="${finState.addDate}"></div>
        <div class="form-group"><label>货币</label><select id="te_currency">${CURRENCIES.map(c=>`<option value="${c.code}" ${(t?t.currency:book?.currency)===c.code?'selected':''}>${c.name}(${c.symbol})</option>`).join('')}</select></div>
      </div>
      <div class="form-group"><label>备注</label><input id="te_note" value="${esc(finState.addNote)}" placeholder="添加备注..."></div>
      <div class="keypad">
        ${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button class="${k==='⌫'?'op':''}" onclick="keypadPress('${k}')">${k}</button>`).join('')}
      </div>
    `,'',[
      {text:'取消',cls:'btn-secondary',cb:closeModal},
      {text:'保存',cls:'btn-primary',cb:()=>{
        const amt=Number(finState.addAmount)||0;
        if(amt<=0){ showToast('请输入金额'); return; }
        const accId=$('#te_account').value;
        const data={ type:finState.addType, amount:amt, currency:$('#te_currency').value, account_id:accId, to_account_id:finState.addType==='transfer'?$('#te_toaccount').value:null, category_id:finState.addType==='transfer'?null:finState.addCat, date:$('#te_date').value, note:$('#te_note').value, updated_at:now() };
        if(id){ Object.assign(t,data); }
        else{ state.transactions.push({ id:uid(), device_id:deviceId, book_id:bookId, created_at:now(), ...data }); }
        // 更新账户余额
        const acc=state.accounts.find(a=>a.id===accId);
        if(acc){
          if(finState.addType==='expense') acc.balance=Number(acc.balance)-amt;
          else if(finState.addType==='income') acc.balance=Number(acc.balance)+amt;
          else if(finState.addType==='transfer'){
            acc.balance=Number(acc.balance)-amt;
            const toAcc=state.accounts.find(a=>a.id===$('#te_toaccount').value);
            if(toAcc) toAcc.balance=Number(toAcc.balance)+amt;
          }
          acc.updated_at=now();
        }
        saveLocal(); closeModal(); renderFinance(); showToast('已保存');
      }}
    ]);
  }
  renderModal();
}
window.keypadPress=function(k){
  if(k==='⌫'){ finState.addAmount=finState.addAmount.length>1?finState.addAmount.slice(0,-1):'0'; }
  else if(k==='.'){ if(!finState.addAmount.includes('.')) finState.addAmount+='.'; }
  else { if(finState.addAmount==='0') finState.addAmount=k; else finState.addAmount+=k; }
  const el=$('.amount-display .number');
  if(el) el.textContent=Number(finState.addAmount).toLocaleString();
};

function openDebtPayment(did){

    </div>
    <div class="form-group"><label>备注</label><input id="dp_note" placeholder="如：第3期还款"></div>
  `,'',[
    {text:'取消',cls:'btn-secondary',cb:closeModal},
    {text:'确认',cls:'btn-primary',cb:()=>{
      const amt=Number($('#dp_amount').value)||0;
      if(amt<=0){ showToast('请输入金额'); return; }

      d.updated_at=now();

  ]);

function exportData(){
  const data=JSON.stringify(state,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='xiaole_backup_'+today()+'.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('已导出备份文件');
}
function exportCSV(){
  const tx=state.transactions.filter(t=>!t.deleted);
  const rows=[['日期','类型','分类','账户','金额','货币','备注']];
  tx.forEach(t=>{
    const cat=state.categories.find(c=>c.id===t.category_id);
    const acc=state.accounts.find(a=>a.id===t.account_id);
    rows.push([fmtDate(t.date),t.type==='income'?'收入':t.type==='expense'?'支出':'转账',cat?cat.name:'',acc?acc.name:'',t.amount,t.currency,t.note||'']);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='finance_'+today()+'.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('CSV已导出');
}
async function clearAllData(){
  const ok=await showConfirm('清空所有数据','确定要删除所有数据吗？此操作不可恢复，本地和云端数据都会被删除！');
  if(!ok) return;
  const ok2=await showConfirm('再次确认','真的要清空吗？所有待办、教学、生活、学习、创业、财务数据都将永久删除！');
  if(!ok2) return;
  // 清本地
  TABLES.forEach(t=>state[t]=[]);
  state.settings={};
  saveLocal();
  // 清云端
  for(const table of TABLES){
    await sbReq(table,'DELETE',null,{'device_id':'eq.'+deviceId});
  }
  closeModal();
  renderAll();
  showToast('所有数据已清空');
}
